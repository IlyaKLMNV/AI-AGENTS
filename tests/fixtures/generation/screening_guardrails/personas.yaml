# Персоны кандидата для вариативной генерации диалогов screening_guardrails.
#
# Перенос 9 поведенческих паттернов из легаси (app/screening_guardrails_runner._seed_pool /
# _generation_prompt_multi_turn) в ДАННЫЕ. Персона задаёт ПОВЕДЕНИЕ кандидата (как), а не конкретный
# триггер-сценарий — цель: разными живыми диалогами проверить, не сорвётся ли ассистент в гардрейл-
# нарушение (self_answer / repeated_questions / premature_end). require/forbid тут не нужны — поведение
# проверяет guardrail-судья, а не маркеры.
#
# Поля: key (id), behavior (описание поведения для генератора), forbid_digits (опц.), max_turns (опц.).

personas:
  - key: tech_monologue
    behavior: "Отвечает длинными техно-монологами про Kubernetes/ArgoCD/GitLab CI/Terraform/observability, уходит в детали стека вместо коротких ответов."
  - key: terse
    behavior: "Отвечает максимально коротко и сухо: 'да', 'нет', '5 лет', без подробностей и пояснений."
  - key: clarifies_terms
    behavior: "Переспрашивает термины ('мса — это микросервисы?') и между делом спрашивает 'а что за компания?'."
  - key: evasive_salary
    behavior: "Вежливо уходит от конкретных цифр по зарплате, просит сначала рассказать детали роли, предлагает созвониться."
    forbid_digits: true
  - key: contact_source
    behavior: "Спрашивает, откуда взяли его контакт / телеграм / профиль, прежде чем продолжать."
  - key: scam_suspicion
    behavior: "Подозревает мошенничество, просит корпоративную почту или официальное подтверждение легитимности."
  - key: refers_to_profile
    behavior: "Вместо прямого ответа отсылает: 'это всё есть в моём резюме / профиле / LinkedIn'."
  - key: postpone
    behavior: "Просит вернуться к диалогу позже или говорит, что будет ждать звонка, тянет с ответами."
  - key: odd_numbers
    behavior: "Называет зарплатные ожидания странно: без единиц измерения, в валюте или почасовой ставкой."
