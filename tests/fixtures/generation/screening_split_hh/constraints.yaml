# Констрейнты генерации hh (require_any/forbid_any) — валидатор CandidateAgent бракует реплику и
# перегенерит; срезает дрейф в generated. Свой namespace (индексы 1..59) — коллизий с TG нет.
scenarios:
  - index: 5    # отказ ТОЛЬКО от офиса
    require_any: ["офис"]
    forbid_any: ["гибрид", "удал", "частичн"]
  - index: 8    # готов в офис (не про разъезды)
    require_any: ["офис"]
    forbid_any: ["разъезд", "командиров"]
  - index: 10   # [FIELD_WORK]-only отказ, без смягчения «работа в Москве»
    require_any: ["разъезд", "командиров"]
    forbid_any: ["Москв", "работа в"]
  - index: 22   # УТВЕРЖДЕНИЕ «не мой профиль», не вопрос
    require_any: ["не мой профиль", "другой сфер", "другая сфер", "не занимаюсь", "не моя специальн"]
    forbid_any: ["понимаю", "ближе к моей", "есть ли у вас", "?"]
  - index: 26   # выходной, о СЕБЕ
    require_any: ["выходной", "нерабоч"]
    forbid_any: ["отдохн"]
  - index: 27   # уже трудоустроен, без «фронтов»
    require_any: ["оффер", "трудоустроен", "новую работу", "новом месте"]
    forbid_any: ["фронт"]
  - index: 53   # в городе вакансии, формат НЕ подтверждать самому
    require_any: ["Москв"]
    forbid_any: ["готов", "подход"]
  - index: 54   # ближний пригород (Химки): не вызываться про формат самому
    require_any: ["Химки"]
    forbid_any: ["готов", "подход"]
  - index: 55   # далеко, без упоминания переезда
    require_any: ["Владивосток"]
    forbid_any: ["переезд", "готов"]
  - index: 60   # REMOTE + САМ отказ от переезда — тема переезда обязательна
    require_any: ["переезж"]
