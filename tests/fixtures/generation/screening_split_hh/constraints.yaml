# Констрейнты генерации hh (require_any/forbid_any) — валидатор CandidateAgent бракует реплику и
# перегенерит; срезает дрейф в generated. Свой namespace (индексы 1..59) — коллизий с TG нет.
scenarios:
  - index: 5    # отказ ТОЛЬКО от офиса
    require_any: ["офис"]
    forbid_any: ["гибрид", "удал", "частичн"]
  - index: 8    # готов в офис (не про разъезды)
    require_any: ["офис"]
    forbid_any: ["разъезд", "командиров"]
  - index: 10   # [FIELD_WORK]-only отказ, без смягчения «работа в Москве»
    require_any: ["разъезд", "командиров"]
    forbid_any: ["Москв", "работа в"]
  - index: 22   # УТВЕРЖДЕНИЕ «не мой профиль», не вопрос
    require_any: ["не мой профиль", "другой сфер", "другая сфер", "не занимаюсь", "не моя специальн"]
    forbid_any: ["понимаю", "ближе к моей", "есть ли у вас", "?"]
  - index: 26   # выходной, о СЕБЕ
    require_any: ["выходной", "нерабоч"]
    forbid_any: ["отдохн"]
  - index: 27   # уже трудоустроен, без «фронтов»
    require_any: ["оффер", "трудоустроен", "новую работу", "новом месте"]
    forbid_any: ["фронт"]
  # 53/54/55 — про повестку: код обязан САМ спросить формат. Стоит кандидату высказаться о формате
  # первым, как проверка закрывается подтверждением и фокус уходит дальше (54: «формат подойдёт и
  # офис, и гибрид» → ASK_RELOCATION). Поэтому запрещены слова-форматы, а не «готов»/«подход»: те
  # бракуют и безобидное «зарплата подойдёт», сжигая попытки генерации (55 → 2 инфра-ошибки).
  - index: 53   # в городе вакансии, формат НЕ подтверждать самому
    require_any: ["Москв"]
    forbid_any: ["офис", "гибрид", "формат", "удал", "на месте", "переезд"]
  - index: 54   # ближний пригород (Химки): не вызываться про формат самому
    # Маркер — по ОСНОВЕ слова: кандидат пишет «живу в Химках», точная форма «Химки» в живой реплике
    # не звучит, и валидатор три прогона подряд браковал все попытки → 2 инфра-ошибки.
    require_any: ["Химк"]
    forbid_any: ["офис", "гибрид", "формат", "удал", "на месте", "переезд"]
  - index: 55   # далеко, без упоминания переезда И без разговора о формате
    require_any: ["Владивосток"]
    forbid_any: ["офис", "гибрид", "формат", "удал", "на месте", "переезд"]
  - index: 60   # REMOTE + САМ отказ от переезда — тема переезда обязательна
    require_any: ["переезж"]
  - index: 63   # «+15% к текущей»: своя относительная прибавка, а не требование цифры от НАС
    # Вариант 1 потребовал сумму у ассистента — про свои ожидания речи не было, и `salary_claim`
    # пришёл `absent` вместо `unusable`: инвариант ловил не то, на что нацелен.
    require_any: ["15%", "процент"]
    forbid_any: ["конкретная цифра", "конкретную цифру", "назовите", "сколько вы", "вилк",
                 "какая у вас", "какую сумму вы"]
  - index: 71   # просит ссылку — и только: обвинения в подделке уводят диалог в fraud_check
    require_any: ["ссылк"]
    forbid_any: ["не та", "не ту", "подделк", "обман", "мошен", "развод"]
