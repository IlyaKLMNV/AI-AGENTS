# Констрейнты генерации hh (require_any/forbid_any) — валидатор CandidateAgent бракует реплику и
# перегенерит; срезает дрейф в generated. Свой namespace (индексы 1..59) — коллизий с TG нет.
scenarios:
  - index: 5    # отказ ТОЛЬКО от офиса
    require_any: ["офис"]
    forbid_any: ["гибрид", "удал", "частичн"]
  - index: 7    # готов в офис (не про разъезды)
    require_any: ["офис"]
    forbid_any: ["разъезд", "командиров"]
  - index: 19   # УТВЕРЖДЕНИЕ «не мой профиль», не вопрос
    require_any: ["не мой профиль", "другой сфер", "другая сфер", "не занимаюсь", "не моя специальн"]
    forbid_any: ["понимаю", "ближе к моей", "есть ли у вас", "?"]
  - index: 22   # уже трудоустроен, без «фронтов»
    require_any: ["оффер", "трудоустроен", "новую работу", "новом месте"]
    forbid_any: ["фронт"]
  - index: 41   # в городе вакансии, формат НЕ подтверждать самому
    require_any: ["Москв"]
    forbid_any: ["офис", "гибрид", "формат", "удал", "на месте", "переезд"]
  # У 42 хореографию ведёт `turn_convey` рецепта: 1-й ход — деньги и город, 2-й — подтверждение
  # формата. Общий forbid_any слов-форматов здесь браковал бы законный второй ход, поэтому снят;
  # осталось требование назвать город и запрет самому поднимать тему переезда.
  - index: 42   # далеко: город назвать, переезд не поднимать
    require_any: ["Владивосток"]
    forbid_any: ["переезд", "переезж"]
  - index: 47   # REMOTE + САМ отказ от переезда — тема переезда обязательна
    require_any: ["переезж"]
  - index: 50   # «+15% к текущей»: своя относительная прибавка, а не требование цифры от НАС
    # Вариант 1 потребовал сумму у ассистента — про свои ожидания речи не было, и `salary_claim`
    # пришёл `absent` вместо `unusable`: инвариант ловил не то, на что нацелен.
    require_any: ["15%", "процент"]
    forbid_any: ["конкретная цифра", "конкретную цифру", "назовите", "сколько вы", "вилк",
                 "какая у вас", "какую сумму вы"]
  - index: 58   # просит ссылку — и только: обвинения в подделке уводят диалог в fraud_check
    require_any: ["ссылк"]
    forbid_any: ["не та", "не ту", "подделк", "обман", "мошен", "развод"]
