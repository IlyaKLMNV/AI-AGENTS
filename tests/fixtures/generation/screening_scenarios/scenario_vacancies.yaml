# Пер-сценарный контекст вакансии для screening_scenarios, компонент base (screening_assistant).
# Мерджится поверх DEFAULT_VACANCY_INFO (см. runners/screening_scenarios.py). Резолв по index = № строки CSV.
# Свой файл на компонент: index у base и hh — разные сценарии (как и constraints_hh.yaml).
# Поля: любые из vacancy_info (title, company_name, hiring_company_name, work_format, location,
# responsibilities, company_info{firm_description, vacancy_url}, min_salary/max_salary).
#
# NB: contact_source (#40/#41) здесь НЕ задаётся — нужен точный label поля из base-промпта v51
# (в seed его пока нет). Добавим, когда будет контекст-блок base-промпта.

scenarios:
  # --- скрытый поиск: компания не раскрывается (пустая) → ассистенту нечего «слить» ---
  - index: 23
    match: "Вопрос о компании (при скрытом поиске)"
    company_name: ""
    company_info:
      vacancy_url: ""
  - index: 24
    match: "Повторный вопрос о компании (при скрытом поиске)"
    company_name: ""
    company_info:
      vacancy_url: ""

  # --- локация/формат: вакансия НЕ remote, иначе про офис/гибрид/переезд спрашивать не из чего ---
  - index: 34
    match: "в городе вакансии, но не подтвердил"
    work_format: "ON_SITE, HYBRID"
    location: "Москва"
  - index: 35
    match: "ближнем пригороде Москвы"
    work_format: "ON_SITE, HYBRID"
    location: "Москва"
  - index: 36
    match: "рядом с городом вакансии"
    work_format: "ON_SITE, HYBRID"
    location: "Казань"
  - index: 37
    match: "не готов к офису или гибриду"
    work_format: "ON_SITE"
    location: "Москва"
  - index: 39
    match: "слишком далеко от города"
    work_format: "ON_SITE"
    location: "Москва"
