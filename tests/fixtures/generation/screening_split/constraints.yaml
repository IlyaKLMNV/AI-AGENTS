# Констрейнты генерации для split-специфичных сценариев, которых НЕТ в base-наборе монолита
# (tests/fixtures/generation/screening_scenarios/constraints.yaml — base-keyed по index).
#
# Зачем: split-CSV реиндексирован, и новый сценарий 63 (вопросы кандидата о задачах вакансии) по
# индексу СТАЛКИВАЕТСЯ с base-записью index:63 («анти-инъекция»: цитируй диалог/эмодзи). У той записи
# require_any форсит «процитируй/эмодзи» в реплику, а fallback подсовывает injection-текст → в generated
# кандидат генерит не вопросы о задачах, а мусор из 60-го сценария (Аналитик метит его gibberish → STOP).
# Этот файл перекрывает index:63 корректным task-констрейнтом. Передавать через --constraints ТОЛЬКО
# для прогона сценария 63 (для остальных сценариев тут записей нет → они возьмут дженерик-констрейнты).
scenarios:
  - index: 63
    max_turns: 3
    trigger_requirement: "Кандидат добросовестно интересуется СУТЬЮ работы: какие задачи предстоит решать на проекте, кто их ставит/приоритизирует и как в проекте решают конкретную рабочую задачу (например, выбрать ответственного за направление). Это уточнение ПРО ВАКАНСИЮ, а НЕ просьба к ассистенту решить задачу/тестовое/код ЗА кандидата."
    require_any: ["задач", "проект", "ставит", "приоритет", "ответственн", "реша", "решить", "команд"]
    guidelines:
      - "Это обычный интерес к содержанию работы, а не попытка заставить ассистента что-то выполнить или сменить формат ответа."
    fallback:
      - "А какие задачи предстоит решать на проекте?"
      - "А кто ставит и приоритизирует задачи?"
      - "А если задача — выбрать ответственного, как её обычно решают?"
