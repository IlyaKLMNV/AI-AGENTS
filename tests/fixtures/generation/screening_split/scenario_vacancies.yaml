# Пер-сценарный контекст вакансии для screening_split (tg). Мерджится поверх DEFAULT_VACANCY_INFO,
# резолв по index = № строки scenarios.csv этого канала.

scenarios:
  # --- скрытый поиск: компания = СКРЫТО → промпт не раскрывает название/ссылки ---
  - index: 17
    match: "Вопрос о компании (при скрытом поиске)"
    company_name: "СКРЫТО"
    company_info:
      vacancy_url: ""
  - index: 23
    match: "в городе вакансии, но не подтвердил"
    work_format: "office"
    location: "Москва"
  - index: 24
    match: "не готов к офису или гибриду"
    work_format: "office"
    location: "Москва"
  - index: 26
    match: "слишком далеко от города"
    work_format: "office"
    location: "Москва"
  - index: 27
    match: "источник контакта заполнен (аккаунт HH)"
    source_type: hh
  - index: 36
    match: "Жду звонка после закрытия всех вопросов (FINISH)"
    questions: "- Опыт с Python и фреймворками?"

  # --- Инцидент 2026-08-17 (tg), сценарии 44/45/46: ИВИ / Senior ML-Engineer, открытый поиск + реальная
  #     ссылка (эталон для канарейки фейк-URL). Вилка 350000–550000: ожидания кандидата (400000–500000 net)
  #     внутрь вилки (иначе KO по зарплате), а её числа не совпадают с числами кандидата (иначе leak-
  #     канарейка приняла бы эхо суммы за утечку). office/Москва — кандидат из Москвы, KO по локации нет.
  - &incident_20260817
    index: 44
    match: "Ответ по зарплате диапазоном net + город → не отсекать"
    title: "Senior ML-Engineer (рекомендательные системы)"
    company_name: "ИВИ"
    responsibilities: "Развитие рекомендательных систем: ранжирование, эмбеддинги, A/B-эксперименты."
    work_format: "office"
    location: "Москва"
    min_salary: 350000
    max_salary: 550000
    company_info:
      firm_description: "Онлайн-кинотеатр, продуктовая ML-команда."
      vacancy_url: "https://hh.ru/vacancy/133203750"
  - <<: *incident_20260817
    index: 45
    match: "Зарплата диапазоном «400000-500000 net» = ответ"
  - <<: *incident_20260817
    index: 46
    match: "Ссылка на вакансию: либо реальная из контекста, либо никакой"
  - index: 8
    match: "Гео-ограничение вакансии: кандидат за границей"
    work_format: "remote"
    location: "Россия, только РФ (работа из-за рубежа невозможна, часовой пояс не более +2 к МСК)"
