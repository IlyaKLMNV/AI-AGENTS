# Курируемые golden-кейсы для теста промпта first_touch.
# input — payload генерации; expected_facts — что сообщение ДОЛЖНО содержать (судит LLM-судья);
# allowed_context_facts — источник/причина (не галлюцинации); optional_facts — необязательные (не валят passed);
# company_hidden — название компании НЕ упоминать; require_question — нужен CTA-вопрос;
# offline_message — каннное сообщение для --offline (содержит факты + вопрос, без утечек/лишних чисел).

- name: backend_visible_with_salary
  input:
    candidate_name: "Иван"
    recruiter_name: "Анна"
    candidate_source: "ваш профиль на GitHub"
    reason_of_communication: "интересный проект в финтехе"
    hiring_company_name: "Акме"
    vacancy_name: "Python Backend разработчик"
    vacancy_responsibilities: "разработка бэкенда и REST API"
    message_formality: "formal"
    company_description: "финтех-компания"
    vacancy_stack: "Python, Django, PostgreSQL"
    salary_range: "200000-300000"
  expected_facts:
    company_name: "Акме"
    vacancy_name: "Python Backend разработчик"
    vacancy_stack: "Python, Django, PostgreSQL"
    salary_range: "200000-300000"
  allowed_context_facts:
    candidate_source: "ваш профиль на GitHub"
  optional_facts: [salary_range]
  company_hidden: false
  require_question: true
  offline_message: |
    Здравствуйте, Иван! Меня зовут Анна. Нашла ваш профиль на GitHub.
    В компании Акме открыта вакансия Python Backend разработчик: разработка бэкенда и REST API
    на стеке Python, Django, PostgreSQL, вилка 200000-300000. Откликнетесь обсудить детали?

