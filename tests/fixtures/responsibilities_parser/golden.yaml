# Golden-кейсы responsibilities_parser (задача: 0..5 САМЫХ СИЛЬНЫХ фильтров отбора, нейтральный стиль).
#
# Стиль требования — КРИТЕРИЙ ВАКАНСИИ («Опыт работы с …», «Понимание …»), НЕ оценка резюме
# («У кандидата есть …» — это теперь contract-fail candidate_fact_style).
# expect — ИЛИ-группы СИЛЬНЫХ обязательных критериев (должны быть покрыты внутри требований);
# forbid — что НЕ должно попасть в фильтры: шум (зарплата/ДМС/график), nice-to-have, слабый стек,
#   выдумки из названия. expect_empty: true — правильный ответ это [].
# offline_output — каннный вывод (нейтральный стиль) для --offline (проходит контракт + expect/forbid).

- name: python_backend_requirements
  vacancy: >
    Python-разработчик Backend.
    Требования: опыт разработки на Python, опыт работы с Django,
    опыт работы с PostgreSQL, понимание REST API.
    Будет плюсом опыт с React.
    Мы предлагаем ДМС и гибкий график.
  expect:
    - ["Python"]
    - ["Django"]
    - ["PostgreSQL", "Postgres"]
    - ["REST API"]
  forbid:
    - "React"
    - "ДМС"
    - "гибкий график"
  offline_output:
    - "Опыт разработки на Python."
    - "Опыт работы с Django."
    - "Опыт работы с PostgreSQL."
    - "Понимание REST API."

- name: mandatory_vs_nice_to_have
  vacancy: >
    Требования: опыт разработки на Python, опыт работы с PostgreSQL.
    Будет плюсом: опыт с Kubernetes и GraphQL.
  expect:
    - ["Python"]
    - ["PostgreSQL", "Postgres"]
  forbid:
    - "Kubernetes"
    - "GraphQL"
  offline_output:
    - "Опыт разработки на Python."
    - "Опыт работы с PostgreSQL."

- name: no_requirements
  vacancy: >
    Описание компании: мы молодая дружная команда, делаем полезный продукт.
    Условия: удалённая работа, ДМС, гибкий график.
    Требования к кандидату не указаны.
  expect_empty: true
  forbid:
    - "удалённая работа"
    - "ДМС"
    - "гибкий график"
    - "дружная команда"
  offline_output: []

- name: only_nice_to_have
  vacancy: >
    Backend-разработчик.
    Будет плюсом опыт с Kubernetes, Kafka и GraphQL.
    Обязательные требования не указаны.
  expect_empty: true
  forbid:
    - "Kubernetes"
    - "Kafka"
    - "GraphQL"
  offline_output: []

# --- приоритизация: выбрать СИЛЬНЫЕ фильтры, а не слабый стек/шум ---

- name: techlead_ai_engineer_prioritizes_strong_filters
  vacancy: |
    TechLead AI Engineer (Python), более 6 лет.
    Проект — внутреннее AI-ядро: RAG, агенты, оркестрация, интеграция с внутренними системами банка.
    Какой профессиональный опыт важен:
    Практический опыт построения production RAG / agent / workflow-систем.
    Опыт интеграции AI-пайплайнов с корпоративными источниками данных, API и внутренними системами.
    Широкий технический кругозор: frontend, backend, mobile, DevOps.
    Стек: Python, SQL, FastAPI, LangGraph, LlamaIndex, Haystack, OpenSearch, Airflow, Docker, Kubernetes, CI/CD.
    Условия: удалёнка и редкие командировки в Ереван.
  expect:
    - ["production RAG", "RAG / agent / workflow", "RAG", "agent", "workflow"]
    - ["интеграции AI-пайплайнов", "корпоративными источниками данных", "внутренними системами"]
    # широкий технический кругозор / DevOps — допускаем выражение через инфра-инструменты (Docker/Kubernetes)
    - ["DevOps", "frontend, backend, mobile, DevOps", "нескольких областей", "Docker", "Kubernetes"]
    - ["командировкам в Ереван", "командировки в Ереван"]
  forbid:
    - "зарплата"
    - "удалёнка"
    - "5/2"
    - "SQL"
    - "Airflow"
  offline_output:
    - "Практический опыт построения production RAG / agent / workflow-систем."
    - "Опыт интеграции AI-пайплайнов с корпоративными источниками данных."
    - "Опыт DevOps или работы на нескольких участках технического стека."
    - "Готовность к редким командировкам в Ереван."

- name: ai_engineer_platform_core_requirements
  vacancy: |
    AI-инженер, опыт 1-3 года, удалённо.
    Основная задача — развивать AI-платформу на базе Dify и других low-code решений,
    подключать её к корпоративным системам, собирать агентов под задачи бизнеса.
    Наши ожидания:
    Опыт работы с AI/LLM-решениями в прикладных задачах.
    Опыт с Dify/n8n или аналогичными платформами.
    Python для интеграций и работы с API.
    Понимание RAG, embeddings, vector search.
    Мы предлагаем ДМС, удалённый формат, 5/2.
  expect:
    - ["AI/LLM-решениями в прикладных задачах", "AI/LLM"]
    - ["Dify/n8n", "Dify", "n8n"]
  forbid:
    - "ДМС"
    - "удалённый формат"
    - "5/2"
  offline_output:
    - "Опыт работы с AI/LLM-решениями в прикладных задачах."
    - "Опыт работы с Dify/n8n или аналогичными платформами."

- name: automation_specialist_required_work_conditions
  vacancy: |
    Специалист по автоматизации технических процессов. Опыт 1-3 года. Удалённо.
    Мы ждём, что вы:
    Занимались коммерческой разработкой от полугода — сами писали код.
    Умеете составлять SQL-запросы, хорошо знаете Python.
    Будет плюсом:
    Знакомы с C++, Java, C#, JavaScript. Публикуетесь на GitHub.
    Для работы потребуются:
    Смартфон или планшет с Android 10 или iOS 15.0 и выше.
    Стабильное интернет-соединение со скоростью не менее 20 Мбит/с.
    Что мы предлагаем: ДМС, официальное трудоустройство, удалённую работу, график 5/2.
  expect:
    - ["писали код", "коммерческой разработкой", "Умение писать код"]
    - ["SQL-запросы", "SQL"]
    - ["Python"]
    - ["Android 10", "iOS 15.0", "Смартфон или планшет"]
    - ["интернет-соединение", "20 Мбит/с"]
  forbid:
    - "C++"
    - "Java"
    - "C#"
    - "JavaScript"
    - "GitHub"
    - "ДМС"
    - "официальное трудоустройство"
    - "5/2"
  offline_output:
    - "Умение писать код и решать задачи разработки."
    - "Умение составлять SQL-запросы."
    - "Хорошее знание Python."
    - "Наличие смартфона или планшета с Android 10 или iOS 15.0 и выше."
    - "Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с."

