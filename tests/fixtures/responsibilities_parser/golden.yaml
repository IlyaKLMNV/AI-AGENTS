# Golden-кейсы responsibilities_parser (НОВАЯ задача: 0..5 проверяемых требований-ПРЕДЛОЖЕНИЙ).
#
# expect — ИЛИ-группы обязательных КРИТЕРИЕВ, которые должны быть ПОКРЫТЫ внутри требований-предложений
#   (концепт «Python» матчится внутри «У кандидата есть опыт разработки на Python»);
# forbid — концепты, которых быть НЕ должно (nice-to-have / soft / условия);
# expect_empty: true — правильный ответ это пустой массив [] (обязательных требований в вакансии нет);
# offline_output — каннный вывод требований-предложений для --offline (должен проходить контракт формы:
#   0..5 элементов, не keyword-подобны, без объединения критериев, ≤250, без дублей).

- name: python_backend_requirements
  vacancy: >
    Python-разработчик Backend.
    Требования: опыт разработки на Python, опыт работы с Django,
    опыт работы с PostgreSQL, понимание REST API.
    Будет плюсом опыт с React.
    Мы предлагаем ДМС и гибкий график.
  expect:
    - ["Python"]
    - ["Django"]
    - ["PostgreSQL", "Postgres"]
    - ["REST API"]
  forbid:
    - "React"
    - "ДМС"
    - "гибкий график"
  offline_output:
    - "У кандидата есть опыт разработки на Python."
    - "У кандидата есть опыт работы с Django."
    - "У кандидата есть опыт работы с PostgreSQL."
    - "У кандидата есть опыт работы с REST API."

- name: mandatory_vs_nice_to_have
  vacancy: >
    Требования: опыт разработки на Python, опыт работы с PostgreSQL.
    Будет плюсом: опыт с Kubernetes и GraphQL.
  expect:
    - ["Python"]
    - ["PostgreSQL", "Postgres"]
  forbid:
    - "Kubernetes"
    - "GraphQL"
  offline_output:
    - "У кандидата есть опыт разработки на Python."
    - "У кандидата есть опыт работы с PostgreSQL."

- name: devops_requirements
  vacancy: >
    SRE / DevOps инженер.
    Требования: уверенный опыт эксплуатации Kubernetes, опыт работы с Terraform,
    опыт настройки CI/CD.
    Будет плюсом знакомство с Prometheus.
  expect:
    - ["Kubernetes", "k8s"]
    - ["Terraform"]
    - ["CI/CD"]
  forbid:
    - "Prometheus"
  offline_output:
    - "У кандидата есть опыт эксплуатации Kubernetes."
    - "У кандидата есть опыт работы с Terraform."
    - "У кандидата есть опыт настройки CI/CD."

- name: no_requirements
  vacancy: >
    Описание компании: мы молодая дружная команда, делаем полезный продукт.
    Условия: удалённая работа, ДМС, гибкий график.
    Требования к кандидату не указаны.
  expect_empty: true
  forbid:
    - "удалённая работа"
    - "ДМС"
    - "гибкий график"
    - "дружная команда"
  offline_output: []

- name: only_nice_to_have
  vacancy: >
    Backend-разработчик.
    Будет плюсом опыт с Kubernetes, Kafka и GraphQL.
    Обязательные требования не указаны.
  expect_empty: true
  forbid:
    - "Kubernetes"
    - "Kafka"
    - "GraphQL"
  offline_output: []
