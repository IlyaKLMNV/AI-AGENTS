# Курируемые golden-кейсы для теста промпта first_touch_hh (вариант для HeadHunter).
# input — payload генерации (candidate_name, recruiter_name, hiring_company_name, vacancy_name, vacancy_text);
# expected_facts — что сообщение должно содержать (vacancy_name/company + remote/accreditation, если в тексте);
# forbid_in_message — НЕ упоминать источник (сообщение шлётся на hh): hh/хедхантер/резюме/отклик;
# offline_message — каннное сообщение для --offline (факты дословно, с CTA, без упоминания источника).

- name: backend_remote
  input:
    candidate_name: "Иван"
    recruiter_name: "Анна"
    hiring_company_name: "Акме"
    vacancy_name: "Python разработчик"
    vacancy_text: "Удалённый формат работы. Бэкенд на Python и Django, PostgreSQL."
  expected_facts:
    vacancy_name: "Python разработчик"
    company_name: "Акме"
    remote: "удаленный формат работы"
  forbid_in_message: ["hh", "хедхантер", "headhunter", "резюме", "ваш отклик"]
  require_question: true
  offline_message: |
    Здравствуйте, Иван! Меня зовут Анна.
    В компании Акме открыта вакансия Python разработчик: удаленный формат работы, бэкенд на Python и Django.
    Готовы обсудить детали?

