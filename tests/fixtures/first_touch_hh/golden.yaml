    vacancy_text: "Компания с IT-аккредитацией. Интерфейсы на React и TypeScript."
  expected_facts:
    vacancy_name: "Frontend разработчик"
    company_name: "ТехКорп"
    accreditation: "IT-аккредитация"
  forbid_in_message: ["hh", "хедхантер", "headhunter", "резюме", "ваш отклик"]
  require_question: true
  offline_message: |
    Здравствуйте, Мария! Меня зовут Олег.
    В ТехКорп открыта вакансия Frontend разработчик: у компании есть IT-аккредитация, стек React и TypeScript.
    Интересно обсудить?

