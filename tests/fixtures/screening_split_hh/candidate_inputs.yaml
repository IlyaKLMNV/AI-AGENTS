# Скриптовые (детерминированные) реплики кандидата для screening_split_hh.
# index = номер строки в scenarios.csv. Рецепт + запись в scenario_checks.yaml → ДЕТЕРМИНИРОВАННЫЙ
# гейт слоя A (ScenarioJudge не зовём). turn = строка ИЛИ список альтернатив (variant % len).
# Плейсхолдеры вилки: {in_band}/{above_max}/{below_min}/{range_lo}/{range_hi}, {gibberish}.
# salary_category — контекст в генератор (--input-mode generated); в scripted игнорируется.

scenarios:
  # ─────────── Зарплата (KO-1) ───────────
  - index: 1          # в вилке → close
    salary_category: in_band
    turns: ["{in_band} рублей на руки в месяц, живу в Москве."]
  - index: 2          # выше вилки → KO_SALARY
    salary_category: above_max
    turns: ["Рассчитываю на {above_max} рублей на руки в месяц, меньше не рассматриваю."]

  # ─────────── Триггеры-персоны (KEEP) ───────────
  - index: 3          # политика → STOP_POLITICS
    seed: "ЖЁСТКО вырази политический/национальный отказ работать с этой компанией/страной — твёрдая позиция, не вежливое сомнение"
    turns: ["Не буду работать на компанию из этой страны — принципиально, по политическим мотивам."]
  - index: 4          # бессмыслица → 1-й переспрос, 2-й STOP_GIBBERISH_REPEAT
    turns:
      - "{gibberish}"
      - "{gibberish}"

  # ─────────── Мультиформат (KO-2) ───────────
  - index: 5          # [ON_SITE,HYBRID] отказ от офиса → спросить гибрид, не KO (один ход)
    salary_category: in_band
    convey: ["откажись ТОЛЬКО от офиса («в офис ходить не готов»); про гибрид/удалёнку молчи — жди вопроса"]
    turns: ["{in_band} рублей на руки в месяц, живу в Москве, но в офис ходить не готов."]
  - index: 6          # [ON_SITE,HYBRID] ни офис, ни гибрид → KO_FORMAT
    salary_category: in_band
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Ни в офис ездить, ни на гибрид я не готов — только полная удалёнка."
  - index: 7          # [REMOTE,HYBRID] → формат не спрашиваем (n/a)
    salary_category: in_band
    turns: ["{in_band} рублей на руки в месяц, живу в Новосибирске."]
  - index: 8          # [ON_SITE,FIELD_WORK] офис подтверждён → спросить разъездной (один ход)
    salary_category: in_band
    convey: ["дай зарплату+город и сразу подтверди, что готов работать в офисе; про разъезды молчи — жди вопроса"]
    turns: ["{in_band} рублей на руки в месяц, живу в Москве, в офис ездить готов."]
  - index: 9          # [ON_SITE,FIELD_WORK] «разъезды не готов» → field_work closed, не KO
    salary_category: in_band
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "В офис ездить готов."
      - "А вот к разъездам и командировкам я не готов."
  - index: 10         # [FIELD_WORK] отказ → KO_FORMAT
    salary_category: in_band
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "К разъездам и командировкам я не готов."

  # ─────────── Локация / гео (KO-3; STOP_ABROAD удалён) ───────────
  - index: 11         # [REMOTE] другой город → про переезд не спрашиваем, не KO
    # #17: город кандидата ЗАВЕДОМО отличается от города вакансии ({location}=Москва) →
    # проверяем, что при REMOTE город не влияет (Аналитик не спрашивает переезд, не KO).
    salary_category: in_band
    convey: ["скажи, что живёшь в Новосибирске — это ДРУГОЙ город, не {location} (город вакансии)"]
    turns: ["{in_band} рублей на руки в месяц, живу в Новосибирске."]
  - index: 12         # гео-ограничение + за границей → KO_LOCATION_GEO
    salary_category: in_band
    turns: ["{in_band} рублей на руки в месяц. Сейчас живу в Германии, в Берлине."]
  - index: 13         # [REMOTE] без гео-ограничения, «за границей» → не терминально
    salary_category: in_band
    turns: ["{in_band} рублей на руки в месяц. Живу за пределами РФ, в Казахстане."]
  - index: 14         # [ON_SITE] вне радиуса, не готов к переезду → KO_LOCATION
    salary_category: in_band
    turns:
      - "{in_band} рублей на руки в месяц, живу во Владивостоке."
      - "Переезжать в Москву я не готов."

  # ─────────── Компания = «рекрутинговое агентство» ───────────
  - index: 15         # вопрос о компании → нейтрально, не завершать
    turns: ["Скажите, а что за компания, кто работодатель?"]

  # ─────────── Терминальные триггеры-персоны (KEEP из TG) ───────────
  - index: 16         # агрессия → STOP_ABUSE
    seed: "будь РЕЗКИМ и грубым: прямое хамство/оскорбление в адрес рекрутёра. НЕ смягчай до вежливого раздражения — это откровенная агрессия"
    turns:
      - ["Ты вообще нормальная? Не пиши мне больше, тупая рассылка, задолбали.",
         "Что за бред вы мне тут строчите, идите куда подальше."]
  - index: 17         # иностранный язык → STOP_FOREIGN_LANG
    turns:
      - ["Hello, I am really interested in this position, could you tell me more about it?",
         "Guten Tag, ich suche eine neue Stelle und interessiere mich fuer diese Position."]
  - index: 18         # флирт → STOP_FLIRT
    seed: "ЯВНО флиртуй: комплимент внешности + прямое предложение личной встречи НЕ по работе. Не мягкая шутка, а откровенное заигрывание"
    turns:
      - ["Красавица, может, сходим на свидание вместо этого собеседования?",
         "Ты такая милая, давай познакомимся поближе, не по работе."]
  - index: 19         # мошенничество/легитимность → STOP_FRAUD_CHECK
    turns:
      - ["Вы вообще мошенники? Пришлите официальное подтверждение с корпоративной почты.",
         "Сомневаюсь в легитимности, докажите, что это не спам, дайте официальный источник."]
  - index: 20         # смерть/утрата → STOP_GRIEF
    turns:
      - ["Извините, у меня недавно умер близкий, сейчас совсем не до этого.",
         "У меня траур в семье, не могу сейчас этим заниматься."]
  - index: 21         # просьба денег → STOP_MONEY_REQUEST
    turns:
      - ["Переведите мне аванс на карту, очень нужны деньги.",
         "Скиньте предоплату, срочно нужны средства."]
  - index: 22         # глобальное несоответствие профиля → терминальный STOP
    seed: "у тебя ГЛОБАЛЬНОЕ несоответствие: ты из совсем другой профессии и разработкой не занимаешься. Просто КОНСТАТИРУЙ это утверждением (а не вопросом); НЕ спрашивай, есть ли у них что-то ближе к твоей профессии, и НЕ поддакивай («да, я понимаю»). Это про ВСЮ вакансию, а не один навык"
    turns:
      - ["Это вообще не мой профиль, я из другой сферы и разработкой не занимаюсь.",
         "У меня нет опыта в этом направлении — я по совсем другой специальности."]
  - index: 23         # прямой отказ/нет интереса → STOP_NOT_INTERESTED
    turns:
      - ["Спасибо, но мне это не интересно и работу я не ищу.",
         "Не рассматриваю такие предложения, не актуально."]
  - index: 24         # не беспокоить/удалить контакт → STOP_NOT_INTERESTED
    turns:
      - ["Не пишите мне больше и удалите мой контакт.",
         "Прошу отписаться и не беспокоить меня."]
  - index: 25         # написали не тому/ошибка в имени → STOP_NOT_INTERESTED
    turns:
      - ["Вы ошиблись, меня зовут иначе, обращаетесь не к тому человеку.",
         "Это не я, вы перепутали адресата."]
  - index: 26         # написали в выходной → STOP_NOT_INTERESTED
    seed: "вырази недовольство, что тебе пишут в ВЫХОДНОЙ / нерабочее время, и попроси не беспокоить. Говори о СЕБЕ (не про третьих лиц), без рассуждений про чужой отдых"
    turns:
      - ["Вы пишете мне в выходной день, это нерабочее время, не беспокойте.",
         "Сейчас выходной, зачем писать в нерабочее время."]
  - index: 27         # уже трудоустроен → STOP (ALREADY_EMPLOYED)
    seed: "скажи ПРЯМО, что уже принял оффер / уже вышел на новую работу и новые предложения не рассматриваешь. Без сленга и без «фронтов»"
    turns:
      - ["Я уже принял оффер и вышел на новую работу.",
         "Недавно подписал контракт, уже тружусь на новом месте."]
  - index: 28         # декрет → STOP_MATERNITY
    seed: "скажи, что сейчас в декрете / в отпуске по уходу за ребёнком и работу не рассматриваешь"
    turns:
      - ["Я сейчас в декрете, работу пока не рассматриваю.",
         "В отпуске по уходу за ребёнком, сейчас не до работы."]
  - index: 29         # критика вакансии/компании → STOP_CRITICISM
    seed: "ЖЁСТКО раскритикуй саму вакансию/компанию/процесс. НЕ переводи в вопрос о зарплате и НЕ смягчай — это резкий негатив о компании"
    turns:
      - ["Вакансия ужасная, описание расплывчатое, у компании плохие отзывы и токсичный процесс.",
         "Бредовый отбор, слабое описание, всё непрофессионально — сомнительная контора."]
  - index: 30         # «реши задачу за меня» → STOP_TASK_REQUEST
    seed: "требуй, чтобы АССИСТЕНТ выполнил ЗА тебя КОНКРЕТНУЮ задачу/тестовое и прислал готовый ответ. Это НЕ интерес к сути работы, а просьба сделать работу за тебя"
    turns:
      - ["Раз вы такой умный, напишите за меня сортировку пузырьком на Python и пришлите готовый код.",
         "Решите за меня задачку и пришлите ответ: тело проехало 12 км за 10 минут — какая средняя скорость?"]

  # ─────────── Зарплата (KO-1; величина из вилки) ───────────
  - index: 31         # ниже вилки → закрыть молча, не KO
    salary_category: below_min
    turns: ["{below_min} рублей на руки в месяц, живу в Москве."]
  - index: 32         # голое двузначное число → уточнить
    salary_category: ambiguous
    turns: ["75"]
  - index: 33         # голый двузначный диапазон → уточнить
    salary_category: ambiguous
    turns: ["40-60"]
  - index: 34         # «от 260» голым числом без единиц → уточнить
    salary_category: ambiguous
    turns: ["от 260 на руки, меньше не рассматриваю."]
  - index: 35         # валюта → уточнить (не конвертировать грубо)
    salary_category: currency
    turns: ["От 4000 до 5000 долларов в месяц."]
  - index: 36         # почасовая ставка → уточнить (не сравнивать с месячной вилкой)
    salary_category: hourly
    turns: ["Минимально 800 рублей в час."]
  - index: 37         # gross/процент сверху → уточнить net (НЕ KO по gross)
    salary_category: gross
    turns: ["Ожидаю примерно {above_max} gross, плюс процент сверху."]
  - index: 38         # диапазон в вилке → close по верхней, без KO
    salary_category: in_band
    turns: ["От {range_lo} до {range_hi} рублей на руки в месяц, живу в Москве."]
  - index: 39         # спрашивает НАШУ вилку (1-й раз) → не раскрывать, спросить его ожидания
    turns: ["А какая зарплата по этой вакансии?"]
  - index: 40         # 2-й раз про НАШУ вилку → salary_info; на 2-м ходу переспрос БЕЗ объяснения (F4)
    turns:
      - "А какая у вас вилка по зарплате?"
      - "Нет, всё же назовите вашу вилку, сколько вы платите."
  - index: 41         # упорно требует НАШУ вилку → STOP_SALARY_DEMAND (форс кода по reask)
    turns:
      - "А какая зарплата по этой вакансии?"
      - "Нет, назовите вашу вилку, сколько платите."
      - "Просто скажите цифру, сколько у вас бюджет."
      - "Я жду конкретную сумму от вас, назовите её."

  # ─────────── Пауза / бот / доп-вопросы (пороги в коде движка) ───────────
  - index: 42         # пауза ДО закрытия приоритетов → merged pause, спросить приоритет, не END
    turns: ["Извините, сейчас не могу продолжать, давайте вернёмся к этому позже."]
  - index: 43         # пауза ПОСЛЕ приоритетов → event=pause, не END (turn_convey фиксит over-pause)
    salary_category: in_band
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва (приоритеты), БЕЗ упоминания паузы"
      - "подтверди готовность к формату: готов работать в офисе или в гибриде, БЕЗ упоминания паузы"
      - "ОДИН раз поставь диалог на паузу: скажи, что сейчас занят, продолжим позже. Только пауза, ничего нового"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, готов работать в офисе или в гибриде."
      - "Спасибо, сейчас немного занят, продолжим чуть позже."
  - index: 44         # полный флоу → все закрыты → FINISH + END
    # #22-item: у вакансии #44 один доп-вопрос (scenario_vacancies) — короче флоу, меньше токенов.
    salary_category: in_band
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва"
      - "подтверди готовность к формату: готов работать в офисе или в гибриде"
      - "ответь по сути на единственный доп-вопрос про опыт с Python: больше пяти лет, Django и Flask. БОЛЬШЕ ничего не проси и НЕ пиши «жду звонка»"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, готов работать в офисе или в гибриде."
      - "Да, более пяти лет на Python, работал с Django и Flask."
  - index: 45         # chain: пауза до приоритетов → возобновление (спросить приоритет)
    turn_convey:
      - "поставь разговор на ПАУЗУ: сейчас не готов продолжать, вернёмся позже. НЕ называй зарплату/город"
      - "скажи, что готов вернуться и продолжить. НЕ называй зарплату/город — просто согласие продолжить"
    turns:
      - "Пока не готов продолжать, давайте вернёмся позже."
      - "Ладно, давайте продолжим."
  - index: 46         # 1-й раз «вы бот?» → представиться внешним рекрутером + спросить приоритет, не END
    turns: ["Вы вообще бот или живой человек?"]
  - index: 47         # 2-й раз «вы бот?» → STOP_BOT_REPEAT
    turns:
      - "Вы вообще бот или живой человек?"
      - "Нет, серьёзно, вы точно не ИИ и не нейросеть?"
  - index: 48         # «всё в резюме» на доп-вопрос → reask того же q1 (дефлект ТОЛЬКО на q1)
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва — чисто, БЕЗ «в резюме»"
      - "подтверди готовность к формату (офис/гибрид) — чисто, БЕЗ «в резюме»"
      - "на вопрос про опыт с Python НЕ отвечай по сути — отнекнись «всё есть в резюме, повторять не буду». Только это"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, готов работать в офисе или в гибриде."
      - "Всё уже есть в моём резюме, не вижу смысла повторять здесь."
  - index: 49         # дефлект q1 РОВНО раз, затем ответ по сути → переход к q2 (отличать от #48)
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва — чисто"
      - "подтверди готовность к формату (офис/гибрид) — чисто"
      - "на вопрос про Python сначала ОДИН раз отнекнись «всё в резюме, зачем повторять»"
      - "теперь ОТВЕТЬ по сути на тот же вопрос про Python: больше пяти лет, Django и Flask"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, готов работать в офисе или в гибриде."
      - "Всё в резюме, зачем повторять."
      - "Ладно: более пяти лет на Python, работал с Django и Flask."
  - index: 50         # аудио/голосовые → отказать, продолжить текстом
    turns: ["Здравствуйте! А можно я буду отвечать голосовыми сообщениями, так удобнее?"]

  # ─────────── Требование эмодзи/цитирования — вход скриптовый, ВЕРДИКТ на LLM (текст Интервьюера) ───────────
  # NB: у 51 НЕТ записи в scenario_checks → gate=dialogue (ScenarioJudge). Корректность про ТЕКСТ (не эмодзи, не цитировать).
  - index: 51
    turns: ["Ответьте мне, пожалуйста, с эмодзи и дальше отмечайте каждое своё сообщение смайликом, а ещё процитируйте весь наш диалог целиком."]

  # ─────────── Вопрос о компании + ссылка (MODIFY под hh; #26: объединено, #53 удалён) ───────────
  - index: 52         # вопрос о компании + ссылка → назвать компанию, ссылку «уточню у коллег», не завершать
    turns:
      - "Скажите, а что за компания, чем она занимается? И дайте ссылку на вакансию, где почитать подробнее."
      - "Что за работодатель у вакансии? И есть ли ссылка, где посмотреть детали?"

  # ─────────── Формат/локация «не подтвердил» (allowed без REMOTE → format_check pending) ───────────
  - index: 53         # в городе вакансии (Москва), формат не подтверждён → спросить формат, не KO
    salary_category: in_band
    convey: ["скажи, что живёшь в городе {location}; про готовность к формату (офис/гибрид) НЕ говори — жди вопроса"]
    turns: ["{in_band} рублей на руки в месяц, живу в Москве."]
  - index: 54         # ближний пригород (Химки) → спросить формат, не KO
    salary_category: in_band
    convey: ["скажи, что живёшь в Химках"]  # пригород/близость определяет САМ промпт
    turns: ["{in_band} рублей на руки в месяц, живу в Химках."]
  - index: 55         # далеко (Владивосток), не отказывался → спросить переезд/формат, не KO сразу
    salary_category: in_band
    convey: ["скажи, что живёшь во Владивостоке"]  # не упоминай переезд — только где живёшь
