# Боевой тест анти-зацикливания, HH-канал. Аналог `screening_split/counter_loops.yaml`, но без
# кейса про источник контакта: события `contact_source` в канале нет ни в COUNTER_KEYS, ни в реестре.
# Зато есть свои лупы — на формате и разъездном: у hh повестка из четырёх пунктов.
#
# Гоняется РЕАЛЬНЫМ Аналитиком (или Наблюдателем при `--engine policy`); Интервьюер и стор фейковые,
# токены тратит только он — по вызову на ход. Реплики лупов чистые (без новых фактов), иначе прогресс
# обнулит счётчик и замаскирует зацикливание.
#
# expect: ended_by (обязан завершиться не позже хода) · terminal STOP|FINISH · script (точный ключ,
# только где механизм детерминирован) · max_no_progress (инвариант запаса для кооперативных).
cases:
  # ─────────── ЛУПЫ: настойчивый переспрашиватель → STOP_* в пределах кап ───────────
  - name: "компания — луп на вопросе о компании"
    turns:
      - "А что за компания? Название скажите."
      - "Повторю: как называется компания?"
      - "Вы так и не сказали — какая всё-таки компания?"
      - "Дайте хотя бы название компании."
      - "Компанию назовите, пожалуйста."
      - "Так какая компания-то?"
    expect: {ended_by: 5, terminal: STOP}

  - name: "звонок — луп на требовании созвона"
    turns:
      - "Когда созвон? Скажите время."
      - "Назначьте уже конкретное время звонка."
      - "Давайте по делу — назначайте звонок на завтра."
      - "Можно не усложнять? Звонок завтра в удобное время."
      - "Так когда созвон-то?"
      - "Жду от вас время звонка."
    expect: {ended_by: 5, terminal: STOP}

  - name: "«всё в резюме» — луп на отказе отвечать"
    turns:
      - "Всё уже в резюме, почитайте внимательно."
      - "Зарплата и город в резюме, перечитайте."
      - "Всё подробно описано в резюме, не хочу повторять."
      - "Ну вот, писал же — всё в резюме."
      - "В резюме всё есть, не вижу смысла повторять здесь."
      - "Смотрите резюме, там всё."
    expect: {ended_by: 6, terminal: STOP}

  - name: "требует НАШУ вилку ×N → анти-луп по зарплате"
    turns:
      - "А какая у вас вилка по зарплате?"
      - "Нет, назовите вашу вилку, сколько платите."
      - "Просто скажите цифру, какой у вас бюджет."
      - "Я жду конкретную сумму от вас, назовите."
    expect: {ended_by: 4, terminal: STOP, script: STOP_SALARY_DEMAND}

  # ─────────── КАНАЛЬНОЕ: лупы на повестке hh, которых в tg нет ───────────
  # Формат: кандидат уводит разговор с вопроса о формате, своего ответа не даёт. Кап переспросов
  # обязан завершить диалог, а не крутить вопрос бесконечно. Вакансия — присутственная, иначе
  # проверка вырождается: при REMOTE формат не спрашивают вовсе (`format_check: n/a`).
  - name: "формат — уклоняется от ответа про присутствие"
    vacancy: {allowed_formats: ["ON_SITE", "HYBRID"], location: "Москва"}
    turns:
      - "240000 на руки в месяц, живу в Москве."
      - "А расскажите сначала, что за проект и какая команда?"
      - "Ну а всё-таки, какие там задачи и стек?"
      - "Давайте вы сначала про проект, потом я про формат."
      - "Не хочу пока говорить про формат, расскажите про задачи."
      - "Так что там по проекту?"
    expect: {ended_by: 6, terminal: STOP}

  # Разъездной формат — четвёртый пункт повестки, отдельный счётчик переспросов (в tg такой ветки
  # нет вовсе). Проверяем, что уклонение от него тоже упирается в кап, а не крутится.
  - name: "разъездной формат — уклоняется от ответа про командировки"
    vacancy: {allowed_formats: ["ON_SITE", "FIELD_WORK"], location: "Москва"}
    turns:
      - "240000 на руки в месяц, живу в Москве, в офис ездить готов."
      - "А куда именно ездить-то надо? Расскажите про объекты."
      - "Ну а всё-таки, что за объекты и как часто?"
      - "Сначала скажите, что за клиенты, потом отвечу."
      - "Не буду отвечать, пока не расскажете про объекты."
      - "Так что там по объектам?"
    expect: {ended_by: 6, terminal: STOP}

  # ─────────── НЕГАТИВНЫЕ: здоровый кандидат → FINISH, кап НЕ рубит ───────────
  - name: "кооперативный: отвечает по сути → FINISH, кап не срабатывает"
    turns:
      - "Ориентируюсь на 240000 рублей на руки в месяц, живу в Москве."
      - "Опыт с Python больше пяти лет, работал с Django и Flask."
      - "Да, поддерживал высоконагруженные сервисы под нагрузкой."
      - "SQL использую для сложных запросов, оптимизации и отчётов."
    expect: {finish: true, max_no_progress: 2}

  # Лестница мультиформата глазами анти-лупа: кандидат честно отвечает про КАЖДЫЙ формат по очереди.
  # Ходов больше, чем у кооперативного в tg, и ни один не должен считаться переспросом — иначе
  # мультиформат сжигает бюджет ответами кандидата, а не его молчанием.
  - name: "кооперативный по мультиформату: отказ от офиса, согласие на гибрид → FINISH без капа"
    vacancy: {allowed_formats: ["ON_SITE", "HYBRID"], location: "Москва"}
    turns:
      - "Ориентируюсь на 240000 рублей на руки в месяц, живу в Москве."
      - "Каждый день в офисе быть не готов."
      - "Гибрид подходит, пару дней в неделю в офисе — нормально."
      - "Опыт с Python больше пяти лет, Django и FastAPI."
      - "Да, сервисы под нагрузкой поддерживал: шардирование, очереди."
      - "SQL использую постоянно: сложные запросы, индексы, планы."
    expect: {finish: true, max_no_progress: 2}
