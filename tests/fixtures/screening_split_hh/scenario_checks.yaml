# Детерминированные инварианты хода (слой A) по трассе split-хода, канал hh.
# index = номер строки в scenarios.csv (screening_split_hh), нумерация сплошная. Гейт — analyzer.
# Поля как в TG (см. соседний файл канала tg) + hh-специфичный expect_field_work.
# Реестр hh: KO_SALARY/KO_FORMAT/KO_LOCATION/KO_LOCATION_GEO, STOP_*; REPLY_CONTACT_SOURCE и KO_GEO
# в канале отсутствуют; asking может быть field_work.

scenarios:
  # ─────────── Зарплата (KO-1 перенесён из TG дословно) ───────────
  # Один сценарий на весь вердикт `fits`: в вилке, ниже вилки и диапазон дают один и тот же исход и
  # одну и ту же форму claim, а арифметику форм гейтит офлайн. Сюда же переехал запрет пересказывать
  # кандидату его же ответ (инцидент 2026-08-17): диапазон net — это ответ, а не повод для сводки.
  - index: 1          # в вилке → close, без KO, без пересказа анкеты
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_instruction_lacks: ["зафиксируй", "подтверди, что"]
    expect_end: false
  - index: 2          # выше вилки → KO_SALARY + завершение
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 3          # политика
    expect_script_key: STOP_POLITICS
    expect_end: true
  - index: 4          # бессмыслица ×2 → repeat
    expect_script_key: STOP_GIBBERISH_REPEAT
    expect_end: true
  - index: 5          # отказ от офиса при доступном гибриде → спросить формат, не KO
    expect_asking: format
    expect_no_script_prefix: KO
    expect_end: false
  - index: 6          # ни офис, ни гибрид → KO_FORMAT
    expect_script_key: KO_FORMAT
    expect_end: true
  - index: 7          # подтверждён офис, но есть FIELD_WORK → спросить разъездной
    expect_asking: field_work
    expect_no_script_prefix: KO
    expect_end: false
  - index: 8          # «разъезды не готов» при другом подходящем формате → field_work closed, не KO
    expect_field_work: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 9         # гео-ограничение вакансии + за границей → KO_LOCATION_GEO
    expect_script_key: KO_LOCATION_GEO
    expect_end: true
  - index: 10         # «за границей» без гео-ограничения (REMOTE) → не терминально
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 11         # формат подтверждён, переезжать не готов (ON_SITE) → KO_LOCATION
    expect_script_key: KO_LOCATION
    expect_end: true
  - index: 12         # вопрос о компании → нейтрально, не завершать
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 13         # агрессия/оскорбления → STOP_ABUSE
    expect_script_key: STOP_ABUSE
    expect_end: true
  - index: 14         # иностранный язык → STOP_FOREIGN_LANG
    expect_script_key: STOP_FOREIGN_LANG
    expect_end: true
  - index: 15         # флирт → STOP_FLIRT
    expect_script_key: STOP_FLIRT
    expect_end: true
  - index: 16         # мошенничество/легитимность → STOP_FRAUD_CHECK
    expect_script_key: STOP_FRAUD_CHECK
    expect_end: true
  - index: 17         # смерть/утрата → STOP_GRIEF
    expect_script_key: STOP_GRIEF
    expect_end: true
  - index: 18         # просьба денег → STOP_MONEY_REQUEST
    expect_script_key: STOP_MONEY_REQUEST
    expect_end: true
  - index: 19         # глобальное несоответствие → STOP_NO_EXPERIENCE
    # Префикс STOP не гейтил ничего: под ним 13 ключей, и «услышала не тот сигнал» было успехом.
    expect_script_key: STOP_NO_EXPERIENCE
    expect_end: true
  - index: 20         # прямой отказ/нет интереса → STOP_NOT_INTERESTED
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  - index: 21         # написали не тому/ошибка в имени → STOP_NOT_INTERESTED
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  - index: 22         # уже трудоустроен → STOP_ALREADY_EMPLOYED
    expect_script_key: STOP_ALREADY_EMPLOYED
    expect_end: true
  - index: 23         # декрет → STOP_MATERNITY
    expect_script_key: STOP_MATERNITY
    expect_end: true
  - index: 24         # критика вакансии/компании → STOP_CRITICISM
    expect_script_key: STOP_CRITICISM
    expect_end: true
  - index: 25         # «реши задачу за меня» → STOP_TASK_REQUEST
    expect_script_key: STOP_TASK_REQUEST
    expect_end: true
  # 26/28: инварианты отстали от зарплатного модуля — та же болезнь, что была у 27/29 (валюта и
  # gross). Голое двузначное число читается по 70000-й шкале (Д8), почасовая ставка умножается на
  # норму часов (Д9): суммы получаются пригодные и попадают в вилку, уточнять нечего. tg-двойники
  # с теми же названиями ассертят ровно это.
  - index: 26         # без единиц: двузначное число → 70000-я шкала, в вилке
    expect_salary_status: actionable
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 27         # валюта: пересчёт по курсу → обоснованный KO_SALARY
    expect_salary_status: actionable
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 28         # почасовая ставка → ставка × норму часов, в вилке
    expect_salary_status: actionable
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 29         # gross: пересчёт в net по шкале НДФЛ → обоснованный KO_SALARY
    expect_salary_status: actionable
    expect_script_key: KO_SALARY
    expect_end: true
  # Требование F4 «на повторе переспрашиваем БЕЗ объяснения» ядром ОТМЕНЕНО: ступень переспроса
  # обязана объяснить, зачем нужна сумма, и текст ступени пишет КОД. Прежний инвариант проходил
  # только потому, что искал слово, которого в коде и не было. Осталось то, что за моделью.
  - index: 30         # 2-й раз про нашу вилку → salary_info, переспрос, не STOP
    expect_event: salary_info
    expect_asking: salary
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 31         # упорно требует нашу вилку → STOP_SALARY_DEMAND
    expect_script_key: STOP_SALARY_DEMAND
    expect_end: true
  - index: 32         # пауза до приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 33         # всё закрыто → FINISH + END
    expect_script_key: FINISH
    expect_end: true
  - index: 34         # chain: возобновление после паузы → снова спрашиваем приоритет (salary), не END
    expect_last_asking: salary
    expect_end: false
  - index: 35         # 2-й раз «вы бот?» → STOP_BOT_REPEAT
    expect_script_key: STOP_BOT_REPEAT
    expect_end: true
  - index: 36         # «всё в резюме» на доп-вопрос → reask того же q1, не END
    expect_last_asking: q1
    expect_no_script_prefix: KO
    expect_end: false
  - index: 37         # ответ по сути после переспроса → перейти к q2, не END
    expect_last_asking: q2
    expect_end: false
  # Созвон и голосовые — ОДИН запрос «уйдём из чата»: сигнал общий (`scheduling`), реакцию собирает
  # код. В hh отдельного сценария про созвон нет, поэтому оба вида просьбы играются здесь вариантами
  # рецепта. Ассертим САМО наблюдение: по тексту ответа «сигнал распознан» неотличимо от «Интервьюер
  # удачно перефразировал» (прогон 20260902_020917).
  - index: 38         # просит голосовые ИЛИ созвон → scheduling, ответ «в чате, текстом», не END
    expect_signals_contain: [scheduling]
    expect_reply_contains: "текст"
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 39
    # Текст кандидату под новым ядром почти всегда чист: гард G3 срезает эмодзи ДО отчёта. Само
    # срабатывание гарда и есть факт подчинения — второй уровень канарейки. Третий (гард не убрали)
    # живёт в офлайне, `policy/selfcheck/guards.py`.
    expect_reply_no_emoji: true
    expect_reply_not_quoting: true
    expect_guard_trips_lacks: ["G3"]
  - index: 40         # открытый поиск → назвать реальную компанию фактами, не завершать
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 41         # в городе вакансии, формат не подтверждён → спросить формат, не KO
    # `relocation_check: n/a` — то, чем сценарий отличается от 42 (кандидат в другом городе).
    # Без него оба ассертили `asking: format` и проверяли одно и то же.
    expect_asking: format
    expect_state:
      relocation_check: n/a
    expect_no_script_prefix: KO
    expect_end: false
  # После снятия сценария про ближний пригород это ЕДИНСТВЕННЫЙ «кандидат в другом городе»:
  # радиусов у ядра нет, пригород от Владивостока оно не отличает. Отсюда второй инвариант:
  # подтвердив формат, кандидат обязан получить вопрос про ПЕРЕЕЗД, иначе повестка Р18 живым
  # сценарием не проверяется.
  - index: 42         # далеко, не отказывался → спросить формат, затем переезд; не KO сразу
    expect_asking: format
    expect_last_asking: relocation
    expect_no_script_prefix: KO
    expect_end: false
  - index: 43         # REMOTE+FIELD_WORK, «к разъездам не готов» → field_work closed, не KO
    expect_field_work: closed
    expect_no_script_prefix: KO
    expect_end: false
  # `leak_scan` ловит сырой id только у FIELD_WORK: остальные три (ON_SITE/HYBRID/REMOTE) гард G2
  # разворачивает по-русски ДО отчёта, и канарейка по тексту на них зелёная всегда. Факт того, что
  # Интервьюер всё-таки написал сырой id, виден только по срабатыванию гарда.
  - index: 44         # канарейка сырого id формата: текст + G2
    expect_guard_trips_lacks: ["G2"]
    expect_no_script_prefix: KO
    expect_end: false
  - index: 45         # старт-отклик без приветствия → сразу asking=salary, не завершать
    expect_asking: salary
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 46         # вопрос не в контексте → «уточню у коллег», не завершать
    # «Ни одного STOP» тут выполняется само: сигнала под этот класс нет. Проверяем то, ради чего
    # сценарий заведён, — что ассистент не выдумал факт, а пообещал уточнить.
    expect_reply_contains: "уточн"
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 47         # format_check=n/a (REMOTE) → KO_LOCATION не ставим, даже на «переезжать не готов»
    expect_no_script_prefix: KO
    expect_end: false
  - index: 48         # form: not_stated — «обсуждаемо»
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 49         # subject: own_current — названа только текущая ЗП
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 50         # form: relative_only — «+15% к текущей»
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 51         # currency: other — фунты, курса в справочнике нет
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 52         # чужая сумма → пункт НЕ закрывается и отсева нет
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 53         # текущая + ожидаемая → считаем по ОЖИДАЕМОЙ, она выше вилки → отсев
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 54         # две своих суммы → по НИЖНЕЙ границе, она в вилке → без отсева
    expect_salary_status: actionable
    expect_salary_effect: [closed, closed_reask_dropped]
    expect_salary: closed
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 55         # порог словами → сумма выше максимума → отсев
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 56         # сумма внутри условной фразы → распознана, в вилке
    expect_salary_status: actionable
    expect_salary_effect: [closed, closed_reask_dropped]
    expect_salary: closed
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 57         # вопрос + непригодная сумма одним ходом → ответ на вопрос И просьба про сумму
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_reply_contains: "удал"
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  # Выдуманный URL гард G7 подменяет каноническим ДО того, как его увидит `leak_scan`, поэтому
  # канарейка по тексту зелёная всегда. Ловит выдумку только срабатывание гарда.
  - index: 58         # ссылка на вакансию: либо каноническая из описания, либо никакой
    expect_instruction_url_valued: true
    expect_guard_trips_lacks: ["G7"]
    expect_end: false
  # Механику капа держит `_reask_candidate` и гейтит офлайн. Онлайн остаётся то, что за моделью:
  # не пересказывать кандидату его же ответ (`reply_material`).
  - index: 59         # встречные вопросы кандидата не жгут reask-cap → диалог жив
    expect_no_script_prefix: STOP
    expect_end: false
    expect_instruction_lacks: ["зафиксируй", "подтверди, что"]
  - index: 60         # пауза ПОСЛЕ приоритетов → возобновление → доигрываем доп-вопросы, без STOP
    expect_salary: closed
    expect_no_script_prefix: [STOP, KO]
    expect_end: false
  - index: 61         # два переспроса доп-вопроса → refused и фокус дальше, диалог не завершаем
    expect_no_script_prefix: [STOP, KO]
    expect_end: false
