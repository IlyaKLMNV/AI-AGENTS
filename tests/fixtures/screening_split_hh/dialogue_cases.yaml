# Тест НОРМАЛЬНЫХ диалогов, hh-канал. Ключи `expect` — те же, что в screening_split/dialogue_cases.yaml
# (там же их описание), плюс два канальных: `field_work_check` (четвёртый пункт повестки),
# `formats` (накопленные ответы по форматам, сверка подмножеством) и `reasks_zero`.
#
# Повестка канала: зарплата → присутственный формат → разъездной формат → доп-вопросы.

vacancy:
  allowed_formats: [ON_SITE, HYBRID, FIELD_WORK]
  location: Москва
  # Канальное: у отклика есть готовое приветствие (в eggplant — колонка `greeting`). Код обязан
  # приклеить его к ПЕРВОМУ сообщению кандидату и больше никогда.
  greeting: "Здравствуйте! Меня зовут Анна, я внешний рекрутер. Спасибо за отклик на позицию «Инженер пусконаладки»."

  # Четвёртый вопрос (Kubernetes) существует ради кейса B: по нему кандидат честно говорит «опыта нет».
  questions: |-
    - Опыт с Python и фреймворками?
    - Проектирование сервисов под высокой нагрузкой?
    - Как используете SQL и оптимизацию запросов?
    - Опыт с Kubernetes и оркестрацией контейнеров?

cases:
  - key: A
    title: "лестница мультиформата: офис не подходит, гибрид подходит, разъезды готов + все вопросы"
    guidelines:
      - "Ты реальный заинтересованный кандидат, отвечаешь охотно и по делу."
      - "Живёшь в Москве."
      - "Зарплатные ожидания: 240000 рублей на руки в месяц."
      - "Про формат: работать КАЖДЫЙ день на месте работодателя (в офисе) НЕ готов — так и скажи.
         Гибридный формат подходит, к разъездам и командировкам готов."
      - "На ВСЕ профессиональные вопросы (Python, высокая нагрузка, SQL, Kubernetes) отвечай
         развёрнуто, с конкретикой — у тебя есть весь этот опыт."
      - "Отвечай ТОЛЬКО на то, что спросили в последнем сообщении. Не рассказывай заранее
         про остальные навыки, город, формат и зарплату, пока об этом не спросят."
      - "ПЕРВАЯ реплика — только приветствие и интерес к вакансии, без единого факта о себе:
         ни города, ни формата, ни суммы."
    fallback:
      - "Здравствуйте! Да, вакансия интересна, готов ответить на вопросы."
      - "Живу в Москве, ожидания 240000 на руки."
      - "Каждый день на месте работодателя не готов, а вот гибрид вполне подойдёт."
      - "Гибридный формат подходит, да."
      - "К разъездам готов, командировки не проблема."
      - "С Python 6 лет: Django, FastAPI, асинхронные сервисы."
      - "Проектировал высоконагруженные сервисы, шардирование и очереди."
      - "SQL знаю хорошо: сложные запросы, индексы, планы."
      - "С Kubernetes работал: Helm, автоскейлинг, деплой микросервисов."
    expect:
      finish: true
      salary: closed
      format_check: closed
      field_work_check: closed
      # Главное канальное утверждение: отказ от ОДНОГО формата вакансию не рубит.
      script_absent: [KO_FORMAT, KO_LOCATION, KO_LOCATION_GEO]
      # Приветствие: ровно один раз и ровно на первом сообщении. Текст берётся из вакансии.
      greeting_once: true
      formats: {ON_SITE: "no", HYBRID: "yes", FIELD_WORK: "yes"}
      questions_all: [closed]
      counters_zero: true
      # Переход «офис → гибрид» — новый вопрос, а не переспрос: бюджет жечь не должен.
      reasks_zero: true
      asked_all: true
      ack_on_progress: true
      intro_once: true

  - key: B
    title: "слабые ответы и честное «нет опыта» по ОДНОМУ навыку — не повод для отсева"
    # Только онлайн: предмет проверки — решит ли НАБЛЮДАТЕЛЬ, что «нет опыта по одному пункту» это
    # терминальный сигнал no_experience. В офлайне наблюдение скриптовано нами.
    modes: [online]
    allowed_formats: [REMOTE]     # формат не проверяется — кейс про доп-вопросы
    guidelines:
      - "Ты в Москве, ожидания 240000 на руки."
      - "На технические вопросы (Python, нагрузка, SQL) отвечай РАСПЛЫВЧАТО:
         «ну, работал немного», «по-разному бывало»."
      - "Если спросят про Kubernetes / оркестрацию контейнеров — честно скажи,
         что такого опыта НЕТ, с этим не работал."
      - "Отвечай ТОЛЬКО на то, что спросили в последнем сообщении."
      - "ПЕРВАЯ реплика — только приветствие и интерес к вакансии, без единого факта о себе."
    fallback:
      - "Здравствуйте, да, в целом интересно."
      - "Я в Москве, ожидания 240000 на руки."
      - "С Python работал, ну по-разному бывало."
      - "Нагрузка… что-то было, точно не скажу."
      - "SQL немного трогал."
      - "С Kubernetes не работал, такого опыта нет."
    expect:
      finish: true
      script_absent: [STOP_NO_EXPERIENCE]
      salary: closed
      questions_all: [closed, refused]
      intro_once: true
      asked_all: true
      ack_on_progress: true

  - key: C
    title: "«всё есть в резюме» на первый техвопрос → переспрос, отказ, дальше отвечает по делу"
    allowed_formats: [REMOTE]
    guidelines:
      - "Ты в Москве, ожидания 240000 на руки — это назови нормально."
      - "На ПЕРВЫЙ профессиональный/технический вопрос отвечай ТОЛЬКО отсылкой: «всё есть в резюме»,
         «смотрите мой профиль на hh», «в CV всё указано». Повторяй отсылку, сколько бы раз этот
         вопрос ни переспросили — по существу на него не отвечай."
      - "Начиная со ВТОРОГО профессионального вопроса отвечай нормально и по делу, с конкретикой."
      - "Не груби, не отказывайся от вакансии."
    fallback:
      - "Здравствуйте, интересно."
      - "Москва, 240000 на руки."
      - "Всё есть в моём резюме, посмотрите там."
      - "Я же говорю — смотрите профиль на hh, там всё указано."
      - "В резюме всё есть, не вижу смысла повторять."
      - "Проектировал высоконагруженные сервисы, шардирование и очереди."
      - "SQL знаю хорошо: сложные запросы, индексы, планы."
      - "С Kubernetes работал: Helm, автоскейлинг, деплой микросервисов."
    expect:
      finish: true
      no_stop: true
      questions_any: refused
      questions_all: [closed, refused]
      intro_once: true
      asked_all: true
      reask_varies: true
      ack_on_progress: true

  - key: D
    title: "требует вилку, своей суммы не называет → завершение по лимиту переспросов"
    allowed_formats: [REMOTE]
    guidelines:
      - "Ты НЕ называешь свои зарплатные ожидания ни при каких условиях."
      - "В КАЖДОЙ реплике настойчиво требуешь назвать зарплатную вилку/сколько платят
         по позиции: «какая вилка?», «сколько платите?», «назовите бюджет»."
      - "Отказывайся продолжать, пока не назовут вилку. Свою сумму не давай."
    fallback:
      - "Здравствуйте! А какая зарплатная вилка по позиции?"
      - "Вы не ответили — сколько платите? Назовите вилку."
      - "Я же спрашиваю третий раз: какая вилка? Без этого не продолжу."
      - "Пока не назовёте вилку, дальше не пойдём."
      - "Так какая вилка? Жду ответа."
    expect:
      ended: true
      script_any: [STOP_SALARY_DEMAND]
      script_absent: [KO_SALARY]
      counter_min: {salary_info: 2}
      reask_varies: true

  - key: E
    # Кейс про КЛЮЧ отсева, а не про сам отсев: до правки 31.08 код про переезд не спрашивал вовсе,
    # `relocation_ready` не приходил, и кандидат из другого города отсеивался по формату
    # (`KO_FORMAT` — «не совпадает по формату работы») вместо локации. Радиусов в коде нет: решает
    # не расстояние, а ответ кандидата на прямой вопрос.
    title: "другой город и переезд исключён → KO_LOCATION, а не KO_FORMAT"
    allowed_formats: [ON_SITE]
    questions: |-
      - Опыт с Python и фреймворками?
    guidelines:
      - "Ты живёшь в Казани и переезжать не готов, работать из Москвы не сможешь."
      - "Зарплатные ожидания: 240000 рублей на руки в месяц."
      - "ПЕРВАЯ реплика — только приветствие и интерес к вакансии, без единого факта о себе:
         ни города, ни формата, ни переезда, ни суммы."
      - "Отвечай ТОЛЬКО на то, что спросили в последнем сообщении. Про город, формат и переезд
         не заговаривай сам — иначе диалог кончится на первом ходу и проверять будет нечего."
      - "Про формат работы сам не высказывайся: отказываться от офиса не надо, вопрос в локации."
      - "Если спросят про город — назови Казань и больше ничего не добавляй."
      - "Если спросят про переезд или работу из другого города — откажись прямо: переезжать не будешь."
    fallback:
      - "Здравствуйте, расскажите подробнее."
      - "Ожидания 240000 на руки."
      - "Я в Казани."
      - "Переезжать не готов, из Москвы работать не смогу."
      - "Нет, переезд не рассматриваю."
    expect:
      ended: true
      script_any: [KO_LOCATION]
      script_absent: [KO_FORMAT, STOP_PERSISTENT, FINISH]
      salary: closed
      # Отсев обязан прийти ОТВЕТОМ на вопрос кода про формат, а не по инициативе кандидата.
      # Порог на число ходов тут не годится: LLM-кандидат выкладывает город и отказ на ход раньше,
      # чем его спросили, и ветка при этом отыграна (прогон 20260831_203510).
      asked_before_end: format
