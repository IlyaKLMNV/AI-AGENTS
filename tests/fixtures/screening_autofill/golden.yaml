- name: salary_provided
  dialogue: |
    Рекрутер: Какие у вас зарплатные ожидания?
    Кандидат: Ожидаю от 300000 до 400000 рублей на руки.
    Рекрутер: Понял. Опыт с Kafka есть?
    Кандидат: Да, два года работал с Kafka.
  expect: {min_salary: "<nonempty>", max_salary: "<nonempty>"}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: true
  offline_output:
    preferred_location: ""
    min_salary: "300000"
    max_salary: "400000"
    work_format: ""
    additional_info:
      - {question: "Опыт с Kafka есть?", answer: "Да, два года"}

