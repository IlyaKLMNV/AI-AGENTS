- name: full_form
  dialogue: |
    Рекрутер: Здравствуйте! Расскажите про желаемый формат, город и ожидания по деньгам.
    Кандидат: Удалёнка предпочтительна, живу в Казани, ожидаю около 250000 рублей.
    Рекрутер: Принято. Какой у вас опыт с Python и FastAPI?
    Кандидат: Четыре года на Python, два — с FastAPI.
  expect: {work_format: remote, preferred_location: "<nonempty>"}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: true
  offline_output:
    preferred_location: "Казань"
    min_salary: "250000"
    max_salary: ""
    work_format: remote
    additional_info:
      - {question: "Какой у вас опыт с Python и FastAPI?", answer: "Четыре года Python, два FastAPI"}

- name: only_format_no_extra_questions
  dialogue: |
    Рекрутер: У нас удалённый формат. Подходит?
    Кандидат: Да, удалёнка подходит.
  expect: {work_format: remote}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: false
  offline_output:
    preferred_location: ""
    min_salary: ""
    max_salary: ""
    work_format: remote
    additional_info: []
