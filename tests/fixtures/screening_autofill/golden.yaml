# Курируемые golden-кейсы для теста промпта screening_autofill.
# Вход — `dialogue` (рекрутер/кандидат; раннер «расплющивает» в одну строку, как прод).
# Ожидания:
#   expect — подмножество полей формы. work_format — точным значением ("", remote, office, hybrid);
#            зарплата/локация — спецзначением "<nonempty>" (точный формат варьируется).
#   forbid_in_additional_info — темы, которых не должно быть в доп. вопросах (salary/location/work_format).
#   expect_additional_info_nonempty — должен ли additional_info быть непустым (был не-исключённый вопрос).
#   offline_output — каннная форма для `--offline` (replay без сети); проходит schema + expect + no-leak.

- name: wf_hybrid_explicit
  dialogue: |
    Рекрутер: Здравствуйте! По вакансии Python-разработчик. Рассматриваете гибридный формат, 1-2 дня в офисе?
    Кандидат: Да, гибрид мне подходит, 1-2 дня в офисе ок.
    Рекрутер: Отлично. Какой у вас опыт с Django?
    Кандидат: Три года писал на Django бэкенды.
  expect: {work_format: hybrid}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: true
  offline_output:
    preferred_location: ""
    min_salary: ""
    max_salary: ""
    work_format: hybrid
    additional_info:
      - {question: "Какой у вас опыт с Django?", answer: "Три года, писал бэкенды"}

- name: wf_remote_explicit
  dialogue: |
    Рекрутер: Формат у нас удалённый. Вам подходит полностью удалёнка?
    Кандидат: Да, удалёнка для меня идеальна.
    Рекрутер: Какой у вас стек?
    Кандидат: В основном Go и PostgreSQL.
  expect: {work_format: remote}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: true
  offline_output:
    preferred_location: ""
    min_salary: ""
    max_salary: ""
    work_format: remote
    additional_info:
      - {question: "Какой у вас стек?", answer: "Go и PostgreSQL"}

