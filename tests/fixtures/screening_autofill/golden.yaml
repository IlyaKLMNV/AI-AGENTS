    Рекрутер: Расскажите про опыт с Kubernetes?
    Кандидат: Два года эксплуатировал кластеры Kubernetes.
  expect: {work_format: office}
  forbid_in_additional_info: [salary, location, work_format]
  expect_additional_info_nonempty: true
  offline_output:
    preferred_location: ""
    min_salary: ""
    max_salary: ""
    work_format: office
    additional_info:
      - {question: "Расскажите про опыт с Kubernetes?", answer: "Два года эксплуатировал кластеры"}

