# Тест НОРМАЛЬНЫХ диалогов: не «сработал ли скрипт на таком-то ходе», а «как диалог закончился».
# Сценариев тут нет — есть четыре траектории повестки, которые движок обязан отработать целиком.
# Перенос из tgApi (ветка feat/screening-qa, scripts/screening_qa/dialogue_test.py), пороги
# перекалиброваны под ядро policy.
#
# Кандидата задают guidelines (как себя вести, для LLM-кандидата) + fallback (детерминированные
# запасные реплики; в --offline они же и играют весь диалог).
#
# expect — инварианты ИТОГА диалога (domain/screening_split/checks.evaluate_dialogue):
#   finish: true            — среди скриптов есть FINISH (повестка закрыта штатно);
#   ended: true             — диалог завершён (любым способом);
#   script_any: [A, B]      — сработал хотя бы один из перечисленных;
#   script_absent: [A]      — не сработал ни один из перечисленных;
#   no_stop: true           — ни одного STOP_*/KO_* (диалог обязан доиграться);
#   salary / format_check   — статус пункта в ФИНАЛЬНОМ состоянии;
#   questions_all: [...]    — все доп-вопросы в перечисленных статусах;
#   questions_any: refused  — хотя бы один вопрос в этом статусе;
#   counters_zero: true     — все событийные счётчики нулевые;
#   counter_min: {k: n}     — максимум счётчика за диалог ≥ n (сигнал реально услышан);
#   intro_once: true        — вводная перед доп-вопросами (Б1) прозвучала РОВНО один раз и ровно на
#                             том ходе, где задан первый доп-вопрос (слот `intro` в instruction_parts);
#   asked_all: true         — каждый доп-вопрос ассистент реально ЗАДАЛ. Анти-вырождение: без него
#                             кандидат, вываливший всё в первой реплике, закрывает повестку за ход,
#                             и `questions_all: [closed]` зеленеет, ничего не проверив.
#
# modes — в каких режимах кейс что-то доказывает (по умолчанию в обоих). Кейс, чей предмет проверки
# в режиме подменён заглушкой, ПРОПУСКАЕТСЯ и виден в отчёте как skipped: зелёный кейс, который
# ничего не проверил, врёт хуже, чем красный.

vacancy:
  work_format: hybrid
  location: Москва
  # Четвёртый вопрос (Kubernetes) существует ради кейса B: по нему кандидат честно говорит «опыта нет».
  questions: |-
    - Опыт с Python и фреймворками?
    - Проектирование сервисов под высокой нагрузкой?
    - Как используете SQL и оптимизацию запросов?
    - Опыт с Kubernetes и оркестрацией контейнеров?

cases:
  - key: A
    title: "полный проход: город + ЗП + формат + все вопросы"
    guidelines:
      - "Ты реальный заинтересованный кандидат, отвечаешь охотно и по делу."
      - "Живёшь в Москве."
      - "Зарплатные ожидания: 240000 рублей на руки в месяц."
      - "Готов к гибриду и офису — подтверждай готовность, если спросят про формат/переезд."
      - "На ВСЕ профессиональные вопросы (Python, высокая нагрузка, SQL, Kubernetes) отвечай
         развёрнуто, с конкретикой — у тебя есть весь этот опыт."
      - "Отвечай ТОЛЬКО на то, что спросили в последнем сообщении. Не рассказывай заранее
         про остальные навыки, город, формат и зарплату, пока об этом не спросят."
    fallback:
      - "Здравствуйте! Да, вакансия интересна, готов ответить на вопросы."
      - "Живу в Москве, ожидания 240000 на руки, к гибриду готов."
      - "С Python 6 лет: Django, FastAPI, асинхронные сервисы."
      - "Проектировал высоконагруженные сервисы, шардирование и очереди."
      - "SQL знаю хорошо: сложные запросы, индексы, планы."
      - "С Kubernetes работал: Helm, автоскейлинг, деплой микросервисов."
    expect:
      finish: true
      salary: closed
      format_check: closed
      questions_all: [closed]
      counters_zero: true
      asked_all: true
      # Б1: четыре вопроса подряд — вводная обязана прозвучать перед первым и больше никогда.
      intro_once: true

  - key: B
    title: "слабые ответы и честное «нет опыта» по ОДНОМУ навыку — не повод для отсева"
    # Только онлайн: предмет проверки — решит ли НАБЛЮДАТЕЛЬ, что «нет опыта по одному пункту» —
    # это терминальный сигнал no_experience. В офлайне наблюдение скриптовано нами, то есть ответ
    # на этот самый вопрос задавали бы мы сами, а кейс выродился бы в копию A.
    modes: [online]
    guidelines:
      - "Ты в Москве, ожидания 240000 на руки, к гибриду готов — подтверждай."
      - "На технические вопросы (Python, нагрузка, SQL) отвечай РАСПЛЫВЧАТО:
         «ну, работал немного», «по-разному бывало»."
      - "Если спросят про Kubernetes / оркестрацию контейнеров — честно скажи,
         что такого опыта НЕТ, с этим не работал."
      - "Отвечай ТОЛЬКО на то, что спросили в последнем сообщении. Не рассказывай заранее
         про остальные навыки, город, формат и зарплату, пока об этом не спросят."
    fallback:
      - "Здравствуйте, да, в целом интересно."
      - "Я в Москве, ожидания 240000 на руки, к гибриду готов."
      - "С Python работал, ну по-разному бывало."
      - "Нагрузка… что-то было, точно не скажу."
      - "SQL немного трогал."
      - "С Kubernetes не работал, такого опыта нет."
    expect:
      finish: true
      script_absent: [STOP_NO_EXPERIENCE]
      salary: closed
      format_check: closed
      questions_all: [closed, refused]
      intro_once: true
      asked_all: true

  - key: C
    title: "«всё есть в резюме» на любой техвопрос → переспрос, отказ, едем дальше"
    guidelines:
      - "Ты в Москве, ожидания 240000 на руки, к гибриду готов — это назови нормально."
      - "НО на ЛЮБОЙ профессиональный/технический вопрос отвечай ТОЛЬКО отсылкой:
         «всё есть в резюме», «смотрите мой профиль/LinkedIn», «в CV всё указано».
         Никогда не отвечай на технический вопрос по существу — только отсылай к резюме."
      - "Не груби, не отказывайся от вакансии — просто отсылай к резюме."
    fallback:
      - "Здравствуйте, интересно."
      - "Москва, 240000 на руки, к гибриду готов."
      - "Всё есть в моём резюме, посмотрите там."
      - "Я же говорю — смотрите профиль, там всё указано."
      - "В резюме всё есть, не вижу смысла повторять."
    expect:
      finish: true
      no_stop: true
      questions_any: refused
      questions_all: [closed, refused]
      # Б1, главный риск правки: у этого кандидата каждый вопрос переспрашивается по два-три раза.
      # Фокус на переспросе тот же `qN` — вводная не должна прилипнуть к нему повторно.
      intro_once: true
      asked_all: true

  - key: D
    # Завершает НЕ счётчик salary_info (у него в ядре policy порога нет вовсе, fires_on_nth=None —
    # его читает только выбор шаблона вопроса про деньги), а лимит переспросов зарплаты
    # (REASK_BUDGETS['salary'] = 3). Ассерт на рост счётчика оставлен как признак «деньги услышаны».
    title: "требует вилку, своей суммы не называет → завершение по лимиту переспросов"
    work_format: remote
    guidelines:
      - "Ты НЕ называешь свои зарплатные ожидания ни при каких условиях."
      - "В КАЖДОЙ реплике настойчиво требуешь назвать зарплатную вилку/сколько платят
         по позиции: «какая вилка?», «сколько платите?», «назовите бюджет»."
      - "Отказывайся продолжать, пока не назовут вилку. Свою сумму не давай."
    fallback:
      - "Здравствуйте! А какая зарплатная вилка по позиции?"
      - "Вы не ответили — сколько платите? Назовите вилку."
      - "Я же спрашиваю третий раз: какая вилка? Без этого не продолжу."
      - "Пока не назовёте вилку, дальше не пойдём."
      - "Так какая вилка? Жду ответа."
    expect:
      ended: true
      script_any: [STOP_SALARY_DEMAND]
      script_absent: [KO_SALARY]
      counter_min: {salary_info: 2}
