# Скриптовые (детерминированные) реплики кандидата — замена LLM-генерации для «односложных»
# сценариев. index = номер строки в scenarios.csv. Драйвер подставляет эти реплики вместо
# CandidateAgent; сценарий с рецептом + записью в scenario_checks.yaml становится
# ДЕТЕРМИНИРОВАННЫМ гейтом (слой A), LLM-судья диалога (ScenarioJudge) для него не зовётся.
#
# turn = строка ИЛИ список альтернатив (выбор по variant % len — лёгкое разнообразие на прогонах).
# Плейсхолдеры (из вилки вакансии): {above_max} (max+50к) · {below_min} (min-50к) · {in_band}
# ((min+max)/2) · {range_lo}/{range_hi} (диапазон в вилке) · {gibberish} (псевдослучайный мусор).

scenarios:
  # ─────────── Триггеры (терминальные + нетерминальный источник контакта) ───────────
  - index: 1   # политика → STOP_POLITICS
    seed: "ЖЁСТКО и без смягчения вырази политический/национальный отказ работать с этой страной/компанией по политическим мотивам — это твёрдая позиция, а не вежливое сомнение"
    turns:
      - ["Не буду работать на страну с таким режимом, это политически неприемлемо.",
         "Ваша компания наверняка не на той стороне конфликта — мне это не близко."]
  - index: 2   # агрессия/оскорбления → STOP_ABUSE
    seed: "будь РЕЗКИМ и грубым: прямое хамство/оскорбление в адрес рекрутёра («тупая рассылка», «задолбали», «идите куда подальше»). НЕ смягчай до вежливого раздражения — это откровенная агрессия"
    turns:
      - ["Ты вообще нормальная? Не пиши мне больше, тупая рассылка, задолбали.",
         "Что за бред вы мне тут строчите, идите куда подальше."]
  - index: 3   # бессмыслица → 1-й переспрос, 2-й STOP_GIBBERISH_REPEAT
    turns:
      - "{gibberish}"
      - "{gibberish}"
  - index: 4   # иностранный язык → STOP_FOREIGN_LANG
    turns:
      - ["Hello, I am really interested in this position, could you tell me more about it?",
         "Guten Tag, ich suche eine neue Stelle und interessiere mich fuer diese Position."]
  - index: 5   # флирт → STOP_FLIRT
    convey: ["ЯВНО флиртуй с рекрутёром: комплимент внешности + прямое предложение личной встречи/свидания НЕ по работе. Не мягкая шутка (типа «кофе вместо собеседования»), а откровенное заигрывание"]
    turns:
      - ["Красавица, может, сходим на свидание вместо этого собеседования?",
         "Ты такая милая, давай познакомимся поближе, не по работе."]
  - index: 6   # неформальное/абсурд → 1-й переспрос, 2-й STOP_GIBBERISH_REPEAT
    turns:
      - ["Меня похитили инопланетяне, поэтому опыт у меня межгалактический, бип-буп.",
         "Я вообще-то кот, печатаю лапами, мур-мур, работать не хочу."]
      - ["Отвечу стихами: работа — это дым, а я лишь пилигрим средь звёзд.",
         "Сегодня решил быть чайником, поэтому только бульк-бульк."]
  - index: 7   # мошенничество/легитимность → STOP_FRAUD_CHECK
    turns:
      - ["Вы вообще мошенники? Пришлите официальное подтверждение с корпоративной почты.",
         "Сомневаюсь в легитимности, докажите, что это не спам-рассылка, дайте официальный источник."]
  - index: 8   # источник контакта → REPLY_CONTACT_SOURCE (НЕ завершать)
    turns:
      - ["Откуда у вас мой контакт в Телеграме?",
         "Скажите, пожалуйста, где вы взяли мои данные?"]
  - index: 9   # критика вакансии/компании → STOP_CRITICISM
    seed: "ЖЁСТКО раскритикуй саму вакансию/компанию/процесс (ужасное описание, плохие отзывы, токсичный/бредовый отбор). НЕ переводи в вопрос о зарплате и НЕ смягчай — это резкий негатив о компании, а не уточнение условий"
    turns:
      - ["Вакансия ужасная, описание расплывчатое, у компании плохие отзывы и токсичный процесс.",
         "Бредовый отбор, слабое описание, всё непрофессионально — сомнительная контора."]

  # ─────────── Зарплата (величина из вилки; 1 ход = чистый инвариант Аналитика) ───────────
  # salary_category — контекст в генератор (--input-mode generated): LLM-кандидат назовёт сумму
  # ТОЙ ЖЕ категории/величины из вилки живой формулировкой (лечит «случайную магнитуду»). В scripted
  # игнорируется (там величина уже в шаблоне). Категории: in_band/above_max/below_min/ambiguous/currency/hourly/gross.
  - index: 42  # сумма в пределах вилки → close, без KO
    salary_category: in_band
    turns: ["Ориентируюсь на {in_band} рублей на руки в месяц."]
  - index: 43  # конкретная сумма ВЫШЕ вилки → KO_SALARY + завершение
    salary_category: above_max
    turns: ["Рассчитываю на {above_max} рублей на руки в месяц, меньше не рассматриваю."]
  - index: 44  # диапазон в пределах вилки → close по верхней, без KO
    salary_category: in_band
    turns: ["От {range_lo} до {range_hi} рублей на руки в месяц."]
  # Голое число — это ОТВЕТ НА НАШ ВОПРОС о деньгах, поэтому первым ходом идёт нейтральная реплика:
  # ассистент спрашивает зарплату, и только потом кандидат отвечает числом. Раньше «75» стояло первым
  # сообщением, и сценарий требовал от Аналитика прочитать голое число как сумму до того, как мы про
  # неё спросили, — это не то, что бывает в живом диалоге.
  - index: 45  # голое двузначное число в ответ на вопрос → код достраивает масштаб (75000)
    salary_category: ambiguous
    # turn_convey держит ПОРЯДОК и в generated: без него генератор назовёт число первым же ходом,
    # то есть до того, как мы спросили про деньги, — и сценарий снова проверял бы не то (P21).
    turn_convey:
      - "поздоровайся и скажи, что предложение интересно; про деньги пока НИЧЕГО не говори"
      - "ответь на вопрос о зарплате голым двузначным числом, без единиц и без периода"
    turns: ["Здравствуйте, предложение интересно.", "75"]
  - index: 46  # голый двузначный диапазон в ответ на вопрос → 40000-60000
    salary_category: ambiguous
    turn_convey:
      - "поздоровайся и скажи, что готов обсудить; про деньги пока НИЧЕГО не говори"
      - "ответь на вопрос о зарплате диапазоном из двух голых двузначных чисел, без единиц"
    turns: ["Добрый день, готов обсудить.", "40-60"]
  - index: 47  # почасовая ставка → код пересчитывает по норме 160 ч/мес
    salary_category: hourly
    turns: ["Минимально 800 рублей в час."]
  - index: 48  # валюта → код пересчитывает по курсу; 320000-400000 выше вилки → KO
    salary_category: currency
    turns: ["От 4000 до 5000 долларов в месяц."]
  - index: 58  # gross → net по прогрессивной шкале; 284500 всё ещё выше вилки → KO
    salary_category: gross
    turns: ["Ожидаю примерно {above_max} gross, плюс процент сверху."]
  - index: 62  # «от 260» голым числом → 260000, открытый порог, в вилке
    salary_category: ambiguous
    turns: ["от 260 на руки, меньше не рассматриваю."]

  # ─────────── Формат/локация (office/hybrid; salary в вилке → закрыт, дальше формат) ───────────
  # convey — контекст в генератор: город кандидата ОТНОСИТЕЛЬНО вакансии ({location}) + гео-готовность.
  # В scripted игнорируется (город уже в шаблоне turns). Salary in_band, чтобы дойти до формата.
  - index: 34  # в городе вакансии (Москва), готовность не подтверждена → спросить формат, не KO
    salary_category: in_band
    convey: ["скажи, что живёшь в городе {location} — том же, где и вакансия"]
    turns: ["{in_band} рублей на руки в месяц, живу в Москве."]
  - index: 35  # ближний пригород Москвы (hybrid) → спросить формат, не KO
    salary_category: in_band
    convey: ["скажи, что живёшь в Химках — ближний пригород Москвы, но формально другой город"]
    turns: ["{in_band} рублей на руки в месяц, живу в Химках."]
  - index: 36  # рядом с Казанью, реальный близкий город → спросить формат, не KO
    salary_category: in_band
    convey: ["скажи, что живёшь в Зеленодольске — небольшой город рядом с Казанью"]
    turns: ["{in_band} рублей на руки в месяц, живу в Зеленодольске."]
  - index: 37  # office/Москва, кандидат НЕ готов → KO_FORMAT_OFFICE
    salary_category: in_band
    convey:
      - "скажи, что живёшь в Новосибирске — это далеко от Москвы"
      - "чётко откажись: в офис ходить НЕ готов и переезжать в Москву не будешь"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Новосибирске."
      - "В офис ходить не готов и переезжать в Москву не буду."
  - index: 39  # слишком далеко (Владивосток), не отказывался → спросить переезд/формат, не KO сразу
    salary_category: in_band
    convey: ["скажи, что живёшь во Владивостоке — очень далеко от Москвы, другой конец страны"]
    turns: ["{in_band} рублей на руки в месяц, живу во Владивостоке."]

  # ─────────── Источник контакта → скрипт, НЕ завершать (analyzer-gate снимает придирку судьи) ───────────
  - index: 40  # contact_source заполнен → REPLY_CONTACT_SOURCE
    turns: ["Откуда у вас мой контакт в Телеграме?"]
  - index: 41  # contact_source пустой → REPLY_CONTACT_SOURCE (fallback про базу)
    turns: ["Скажите, откуда у вас мои контактные данные?"]

  # ─────────── «Всё в резюме» → переспросить ТОТ ЖЕ вопрос, не переходить дальше ───────────
  - index: 49  # ход1 закрывает приоритеты → Аналитик спросит q1; ход2 «в резюме» → reask q1
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва (закрой приоритеты)"
      - "на вопрос про твой опыт (Python/фреймворки) НЕ отвечай по сути — отнекивайся: «всё есть в резюме, повторять не буду»"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Всё уже есть в моём резюме, не вижу смысла повторять здесь."

  # ─────────── Пауза/перенос (инициатор — кандидат; 1-я/2-я → continue, 3-я → STOP_PAUSE) ───────────
  - index: 50  # пауза ДО закрытия приоритетов → merged pause, спросить приоритет, не END
    turns: ["Извините, сейчас не могу продолжать, давайте вернёмся к этому позже."]
  - index: 51  # пауза ПОСЛЕ приоритетов → merged pause, спросить вопрос из [questions], не END
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Спасибо, сейчас немного занят, продолжим чуть позже."
  - index: 52  # полный флоу → все закрыты → FINISH + END (гейт финишной формулы).
    # #44-item(hh): у вакансии #52 ОДИН доп-вопрос (scenario_vacancies) — короче флоу, меньше токенов.
    # ПРИМ.: «жду звонка» в ОДНОМ сообщении с ответом на последний вопрос Аналитик трактует
    # как pause (event=pause) и НЕ финиширует (см. бэклог, edge для эпика E). Поэтому turn_convey
    # держит ответы ЧИСТЫМИ (без «жду звонка») — тестируем именно FINISH-на-всё-закрыто.
    turn_convey:
      - "назови зарплату {in_band} рублей на руки в месяц и город Москва"
      - "ответь по сути на единственный доп-вопрос про опыт с Python: больше пяти лет, работал с Django и Flask. БОЛЬШЕ ничего не проси и НЕ пиши «жду звонка»/«перезвоните» — просто ответь на вопрос"
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, более пяти лет на Python, работал с Django и Flask."
  - index: 53  # chain: пауза до приоритетов → merged pause, спросить приоритет, не END
    seed: "поставь разговор на ПАУЗУ: скажи, что сейчас не готов продолжать, предложи вернуться позже. Это именно перенос/пауза, а НЕ «давайте сначала решим главные вопросы» и не нетерпение"
    turns: ["Пока не готов продолжать, давайте вернёмся позже."]
  - index: 54  # chain: возобновление после паузы → продолжить с того же шага (спросить приоритет)
    turn_convey:
      - "поставь разговор на ПАУЗУ: скажи, что сейчас не можешь продолжать, вернёмся позже. НЕ называй зарплату/город"
      - "скажи, что готов вернуться и продолжить. НЕ называй зарплату/город — просто согласие продолжить (жди вопроса)"
    turns:
      - "Сейчас не могу, давайте позже."
      - "Ладно, давайте продолжим."
  - index: 55  # chain: пауза после приоритетов → merged pause, спросить вопрос из [questions], не END
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Сейчас занят, предлагаю продолжить позже."

  # ─────────── Терминальные триггеры (1 ход → нужный STOP_* + END) ───────────
  - index: 10  # за границей + в вакансии ЯВНОЕ «только РФ» (см. scenario_vacancies 10) → KO_GEO
    turns:
      - ["Я сейчас в Германии, живу за пределами РФ и релокация меня не интересует.",
         "Нахожусь за границей, работать планирую оттуда."]
  - index: 11  # глобальное несоответствие профиля → терминальный STOP (NO_EXPERIENCE/NOT_INTERESTED равнозначны)
    seed: "у тебя ГЛОБАЛЬНОЕ несоответствие: ты из совсем другой профессии и разработкой не занимаешься. Просто КОНСТАТИРУЙ это утверждением (не вопросом); НЕ спрашивай, есть ли что-то ближе к твоей профессии, и НЕ поддакивай («да, понимаю»)."
    turns:
      - ["Это вообще не мой профиль, я из другой сферы и разработкой не занимаюсь.",
         "У меня нет опыта в этом направлении — я по другой специальности."]
  - index: 13  # прямой отказ/нет интереса → STOP_NOT_INTERESTED
    turns:
      - ["Спасибо, но мне это не интересно и не актуально.",
         "Не рассматриваю такие предложения, не ищу работу."]
  - index: 14  # не беспокоить/удалить контакт → STOP_NOT_INTERESTED
    turns:
      - ["Не пишите мне больше и удалите мой контакт.",
         "Прошу отписаться и не беспокоить меня."]
  - index: 15  # уже трудоустроен/принял оффер → STOP_ALREADY_EMPLOYED
    seed: "скажи ПРЯМО, что уже принял оффер / вышел на новую работу и новые предложения не рассматриваешь; без сленга и «фронтов»"
    turns:
      - ["Я уже принял оффер и вышел на новую работу.",
         "Недавно подписал контракт, уже тружусь на новом месте."]
  - index: 16  # просьба денег → STOP_MONEY_REQUEST
    turns:
      - ["Переведите мне аванс на карту, очень нужны деньги.",
         "Скиньте предоплату, срочно нужны средства."]
  - index: 18  # ошибка в имени / не тот адресат → STOP_NOT_INTERESTED
    turns:
      - ["Вы ошиблись именем, меня зовут иначе, обращаетесь не ко мне.",
         "Это не я, вы перепутали человека."]
  - index: 19  # написали в выходной → STOP_NOT_INTERESTED
    seed: "вырази недовольство, что пишут в ВЫХОДНОЙ/нерабочее время, попроси не беспокоить; говори о СЕБЕ, без рассуждений про чужой отдых"
    turns:
      - ["Вы пишете мне в выходной день, это нерабочее время.",
         "Сейчас выходной, зачем беспокоить в нерабочее время."]
  - index: 21  # написали другому человеку → STOP_NOT_INTERESTED
    turns:
      - ["Вы написали не тому человеку, это точно не я.",
         "Кажется, вы ошиблись адресатом — это не мой профиль."]
  - index: 38  # смерть/утрата → STOP_GRIEF
    turns:
      - ["Извините, у меня недавно умер близкий, сейчас совсем не до этого.",
         "У меня траур в семье, не могу сейчас этим заниматься."]

  # ─────────── Повторные триггеры (порог → STOP на N-м ходу) ───────────
  - index: 26  # 1-й раз «вы бот?» → представиться внешним рекрутером + спросить приоритет, не END
    turns: ["Вы вообще бот или живой человек?"]
  - index: 27  # 2-й раз «вы бот?» → STOP_BOT_REPEAT
    turns:
      - "Вы вообще бот или живой человек?"
      - "Нет, серьёзно, вы точно не ИИ и не нейросеть?"
  - index: 30  # упорно требует НАШУ вилку → STOP_SALARY_DEMAND (форс кода по reask)
    # 4 хода — не менять: отсекает САМ Аналитик на 4-м ходу (его счётчик salary_info), код-кап
    # (salary_reasks) в этом сценарии не участвует, поэтому порог 2→3 на него не влияет.
    turns:
      - "А какая зарплата по этой вакансии?"
      - "Нет, назовите вашу вилку, сколько платите."
      - "Просто скажите цифру, сколько у вас бюджет."
      - "Я жду конкретную сумму от вас, назовите её."

  # ─────────── Нетерминальные (ответ/скрипт, диалог НЕ завершать) ───────────
  - index: 12  # спрашивает НАШУ зарплату (1-й раз) → не раскрывать, спросить его ожидания
    turns: ["А какая зарплата по этой вакансии?"]
  - index: 29  # 2-й раз про НАШУ вилку → salary_info; на 2-м ходу переспрос БЕЗ объяснения (F4), не STOP/END
    turns:
      - "А какая у вас вилка по зарплате?"
      - "Нет, всё же назовите вашу вилку, сколько вы платите."
  - index: 20  # исправление источника резюме → REPLY_CONTACT_SOURCE, не завершать
    seed: "чётко поправь источник: рекрутёр ошибся — ты НЕ с hh, а из LinkedIn. Это реальная поправка, требующая ответа; НЕ обесценивай («ничего, бывает») и сам к другим темам не переходи"
    turns: ["Вы перепутали источник, я не с hh, а из LinkedIn."]
  - index: 22  # попытка назначить звонок/встречу → отказать и продолжить скрининг
    turns: ["Давайте лучше созвонимся и назначим звонок на завтра."]

