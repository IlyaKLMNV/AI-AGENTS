# Скриптовые (детерминированные) реплики кандидата — замена LLM-генерации для «односложных»
# сценариев. index = номер строки в scenarios.csv. Драйвер подставляет эти реплики вместо
# CandidateAgent; сценарий с рецептом + записью в scenario_checks.yaml становится
# ДЕТЕРМИНИРОВАННЫМ гейтом (слой A), LLM-судья диалога (ScenarioJudge) для него не зовётся.
#
# turn = строка ИЛИ список альтернатив (выбор по variant % len — лёгкое разнообразие на прогонах).
# Плейсхолдеры (из вилки вакансии): {above_max} (max+50к) · {below_min} (min-50к) · {in_band}
# ((min+max)/2) · {range_lo}/{range_hi} (диапазон в вилке) · {gibberish} (псевдослучайный мусор).

scenarios:
  # ─────────── Триггеры (терминальные + нетерминальный источник контакта) ───────────
  - index: 1   # политика → STOP_POLITICS
    turns:
      - ["Не буду работать на страну с таким режимом, это политически неприемлемо.",
         "Ваша компания наверняка не на той стороне конфликта — мне это не близко."]
  - index: 2   # агрессия/оскорбления → STOP_ABUSE
    turns:
      - ["Ты вообще нормальная? Не пиши мне больше, тупая рассылка, задолбали.",
         "Что за бред вы мне тут строчите, идите куда подальше."]
  - index: 3   # бессмыслица → 1-й переспрос, 2-й STOP_GIBBERISH_REPEAT
    turns:
      - "{gibberish}"
      - "{gibberish}"
  - index: 4   # иностранный язык → STOP_FOREIGN_LANG
    turns:
      - ["Hello, I am really interested in this position, could you tell me more about it?",
         "Guten Tag, ich suche eine neue Stelle und interessiere mich fuer diese Position."]
  - index: 5   # флирт → STOP_FLIRT
    turns:
      - ["Красавица, может, сходим на свидание вместо этого собеседования?",
         "Ты такая милая, давай познакомимся поближе, не по работе."]
  - index: 6   # неформальное/абсурд → 1-й переспрос, 2-й STOP_GIBBERISH_REPEAT
    turns:
      - ["Меня похитили инопланетяне, поэтому опыт у меня межгалактический, бип-буп.",
         "Я вообще-то кот, печатаю лапами, мур-мур, работать не хочу."]
      - ["Отвечу стихами: работа — это дым, а я лишь пилигрим средь звёзд.",
         "Сегодня решил быть чайником, поэтому только бульк-бульк."]
  - index: 7   # мошенничество/легитимность → STOP_FRAUD_CHECK
    turns:
      - ["Вы вообще мошенники? Пришлите официальное подтверждение с корпоративной почты.",
         "Сомневаюсь в легитимности, докажите, что это не спам-рассылка, дайте официальный источник."]
  - index: 8   # источник контакта → REPLY_CONTACT_SOURCE (НЕ завершать)
    turns:
      - ["Откуда у вас мой контакт в Телеграме?",
         "Скажите, пожалуйста, где вы взяли мои данные?"]
  - index: 9   # критика вакансии/компании → STOP_CRITICISM
    turns:
      - ["Вакансия ужасная, описание расплывчатое, у компании плохие отзывы и токсичный процесс.",
         "Бредовый отбор, слабое описание, всё непрофессионально — сомнительная контора."]

  # ─────────── Зарплата (величина из вилки; 1 ход = чистый инвариант Аналитика) ───────────
  - index: 42  # сумма в пределах вилки → close, без KO
    turns: ["Ориентируюсь на {in_band} рублей на руки в месяц."]
  - index: 43  # конкретная сумма ВЫШЕ вилки → KO_SALARY + завершение
    turns: ["Рассчитываю на {above_max} рублей на руки в месяц, меньше не рассматриваю."]
  - index: 44  # диапазон в пределах вилки → close по верхней, без KO
    turns: ["От {range_lo} до {range_hi} рублей на руки в месяц."]
  - index: 45  # голое двузначное число → уточнить
    turns: ["75"]
  - index: 46  # голый двузначный диапазон → уточнить
    turns: ["40-60"]
  - index: 47  # почасовая ставка → уточнить (не сравнивать с месячной вилкой)
    turns: ["Минимально 800 рублей в час."]
  - index: 48  # валюта → уточнить (не конвертировать грубо)
    turns: ["От 4000 до 5000 долларов в месяц."]
  - index: 61  # gross/процент сверху → уточнить net (НЕ KO по gross)
    turns: ["Ожидаю примерно {above_max} gross, плюс процент сверху."]
  - index: 65  # «от 260» голым числом без единиц → уточнить
    turns: ["от 260 на руки, меньше не рассматриваю."]

  # ─────────── Формат/локация (office/hybrid; salary в вилке → закрыт, дальше формат) ───────────
  - index: 34  # в городе вакансии (Москва), готовность не подтверждена → спросить формат, не KO
    turns: ["{in_band} рублей на руки в месяц, живу в Москве."]
  - index: 35  # ближний пригород Москвы (hybrid) → спросить формат, не KO
    turns: ["{in_band} рублей на руки в месяц, живу в Химках."]
  - index: 36  # рядом с Казанью, реальный близкий город → спросить формат, не KO
    turns: ["{in_band} рублей на руки в месяц, живу в Зеленодольске."]
  - index: 37  # office/Москва, кандидат НЕ готов → KO_FORMAT_OFFICE
    turns:
      - "{in_band} рублей на руки в месяц, живу в Новосибирске."
      - "В офис ходить не готов и переезжать в Москву не буду."
  - index: 39  # слишком далеко (Владивосток), не отказывался → спросить переезд/формат, не KO сразу
    turns: ["{in_band} рублей на руки в месяц, живу во Владивостоке."]

  # ─────────── Источник контакта → скрипт, НЕ завершать (analyzer-gate снимает придирку судьи) ───────────
  - index: 40  # contact_source заполнен → REPLY_CONTACT_SOURCE
    turns: ["Откуда у вас мой контакт в Телеграме?"]
  - index: 41  # contact_source пустой → REPLY_CONTACT_SOURCE (fallback про базу)
    turns: ["Скажите, откуда у вас мои контактные данные?"]

  # ─────────── «Всё в резюме» → переспросить ТОТ ЖЕ вопрос, не переходить дальше ───────────
  - index: 49  # ход1 закрывает приоритеты → Аналитик спросит q1; ход2 «в резюме» → reask q1
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Всё уже есть в моём резюме, не вижу смысла повторять здесь."

  # ─────────── Пауза/перенос (инициатор — кандидат; 1-я/2-я → continue, 3-я → STOP_PAUSE) ───────────
  - index: 50  # пауза ДО закрытия приоритетов → merged pause, спросить приоритет, не END
    turns: ["Извините, сейчас не могу продолжать, давайте вернёмся к этому позже."]
  - index: 51  # пауза ПОСЛЕ приоритетов → merged pause, спросить вопрос из [questions], не END
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Спасибо, сейчас немного занят, продолжим чуть позже."
  - index: 52  # полный флоу → все закрыты → FINISH + END (гейт финишной формулы).
    # ПРИМ.: «жду звонка» в ОДНОМ сообщении с ответом на последний вопрос Аналитик трактует
    # как pause (event=pause) и НЕ финиширует (см. бэклог, edge для эпика E). Поэтому здесь
    # последний ответ чистый — тестируем именно FINISH-на-всё-закрыто.
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Да, более пяти лет на Python, работал с Django и Flask."
      - "Да, поддерживал высоконагруженные сервисы под нагрузкой."
      - "SQL использую для сложных запросов, оптимизации и построения отчётов."
  - index: 53  # chain: пауза до приоритетов → merged pause, спросить приоритет, не END
    turns: ["Пока не готов продолжать, давайте вернёмся позже."]
  - index: 54  # chain: возобновление после паузы → продолжить с того же шага (спросить приоритет)
    turns:
      - "Сейчас не могу, давайте позже."
      - "Ладно, давайте продолжим."
  - index: 55  # chain: пауза после приоритетов → merged pause, спросить вопрос из [questions], не END
    turns:
      - "{in_band} рублей на руки в месяц, живу в Москве."
      - "Сейчас занят, предлагаю продолжить позже."
