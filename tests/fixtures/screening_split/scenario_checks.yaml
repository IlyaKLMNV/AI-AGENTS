# Детерминированные инварианты Decision/state Аналитика (слой A) по трассе split-хода.
# index = номер строки в scenarios.csv. Сценарий с записью здесь + скриптовым входом
# (candidate_inputs.yaml) — ДЕТЕРМИНИРОВАННЫЙ гейт: проверяем трассу, LLM-судья диалога
# (ScenarioJudge) НЕ зовётся (это и есть перевод с монолит-`expected` на машинные инварианты).
#
# Поля: expect_salary/format (итоговый state) · expect_script_key (точный, сработал) ·
#       expect_script_prefix / expect_no_script_prefix · expect_asking (был на к.-л. ходу) ·
#       expect_end (завершился ли диалог).

scenarios:
  # ─────────── Триггеры (терминальные) → нужный STOP_*/KO_* + завершение ───────────
  - index: 1   # политика
    expect_script_key: STOP_POLITICS
    expect_end: true
  - index: 2   # агрессия/оскорбления
    expect_script_key: STOP_ABUSE
    expect_end: true
  - index: 3   # бессмыслица (2-й раз → repeat)
    expect_script_key: STOP_GIBBERISH_REPEAT
    expect_end: true
  - index: 4   # иностранный язык
    expect_script_key: STOP_FOREIGN_LANG
    expect_end: true
  - index: 5   # флирт
    expect_script_key: STOP_FLIRT
    expect_end: true
  - index: 6   # неформальное/абсурд (2-й раз → repeat)
    expect_script_key: STOP_GIBBERISH_REPEAT
    expect_end: true
  - index: 7   # мошенничество/легитимность
    expect_script_key: STOP_FRAUD_CHECK
    expect_end: true
  - index: 9   # критика вакансии/компании/процесса
    expect_script_key: STOP_CRITICISM
    expect_end: true

  # ─────────── Нетерминальный триггер ───────────
  - index: 8   # источник контакта → скрипт, НЕ завершать
    expect_script_key: REPLY_CONTACT_SOURCE
    expect_end: false

  # ─────────── ЗАКРЫТЬ зарплату (конкретная сумма, без KO, диалог продолжается) ───────────
  - index: 32          # ниже вилки → closed молча, не отказ
    expect_salary: closed
    expect_no_script_prefix: KO
  - index: 42          # в пределах вилки → closed, без лишнего уточнения/KO
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 44          # диапазон в пределах вилки → closed по верхней, без KO
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false

  # ─────────── KO по зарплате (конкретная сумма ВЫШЕ максимума) ───────────
  - index: 43          # сумма выше вилки → KO_SALARY + завершение
    expect_script_key: KO_SALARY
    expect_end: true

  # ─────────── УТОЧНИТЬ (неоднозначная сумма): pending + asking=salary, БЕЗ KO, без завершения ───────────
  - index: 45          # без единиц: двузначное число
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false
  - index: 46          # без единиц: двузначный диапазон
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false
  - index: 47          # почасовая ставка
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false
  - index: 48          # валюта
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false
  - index: 61          # gross/процент сверху → уточнить net, не KO
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false
  - index: 65          # «от 260» голым числом без единиц → уточнить
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: KO
    expect_end: false

  # ─────────── ФОРМАТ/ЛОКАЦИЯ (office/hybrid): спросить готовность, не отказывать сразу ───────────
  - index: 34          # в городе вакансии, не подтвердил → спросить формат, не KO
    expect_format: pending
    expect_asking: format
    expect_no_script_prefix: KO
    expect_end: false
  - index: 35          # ближний пригород → спросить формат, не KO
    expect_asking: format
    expect_no_script_prefix: KO
    expect_end: false
  - index: 36          # рядом с городом → спросить формат, не KO
    expect_asking: format
    expect_no_script_prefix: KO
    expect_end: false
  - index: 37          # не готов к офису/переезду → KO_FORMAT_* + завершение
    expect_script_prefix: KO_FORMAT
    expect_end: true
  - index: 39          # слишком далеко, НЕ отказывался → спросить переезд/формат, не KO сразу
    expect_asking: format
    expect_no_script_prefix: KO
    expect_end: false

  # ─────────── ИСТОЧНИК КОНТАКТА → скрипт, НЕ завершать ───────────
  - index: 40          # contact_source заполнен
    expect_script_key: REPLY_CONTACT_SOURCE
    expect_end: false
  - index: 41          # contact_source пустой (fallback про базу)
    expect_script_key: REPLY_CONTACT_SOURCE
    expect_end: false

  # ─────────── «ВСЁ В РЕЗЮМЕ» → переспросить ТОТ ЖЕ вопрос, не переходить дальше ───────────
  - index: 49          # после дефлекта «в резюме» на последнем ходу всё ещё asking=q1, не завершать
    expect_last_asking: q1
    expect_no_script_prefix: KO
    expect_end: false

  # ─────────── ПАУЗА (1-я/2-я → continue; событие pause распознано, диалог не завершён) ───────────
  - index: 50          # пауза до приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 51          # пауза после приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 52          # всё закрыто → FINISH + END
    expect_script_key: FINISH
    expect_end: true
  - index: 53          # chain: пауза до приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 54          # chain: возобновление → на последнем ходу спрашиваем приоритет (salary), не END
    expect_last_asking: salary
    expect_end: false
  - index: 55          # chain: пауза после приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
