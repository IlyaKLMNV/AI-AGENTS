# Детерминированные инварианты хода (слой A) по трассе split-хода, канал tg.
# index = номер строки в scenarios.csv, нумерация сплошная. Гейт — analyzer: проверяем трассу,
# LLM-судья диалога (ScenarioJudge) не зовётся ни разу.
#
# Поля: expect_salary/format (итоговый state) · expect_state (точечная сверка полей state) ·
#       expect_script_key (точный ключ причины) · expect_no_script_prefix · expect_asking (был на
#       к.-л. ходу) · expect_last_asking (на последнем) · expect_end · expect_event ·
#       expect_reply_contains · expect_instruction_lacks / expect_last_instruction_lacks ·
#       expect_instruction_url_valued · expect_salary_status (absent|unusable|actionable) ·
#       expect_salary_effect · expect_reply_no_emoji / expect_reply_not_quoting ·
#       expect_guard_trips_lacks (какие гарды НЕ должны были сработать).
#
# `expect_script_prefix` больше нет: под префиксом STOP лежат 13 разных ключей, и «модель услышала
# не тот сигнал» проходило как успех. Ключ выводится из сигнала однозначно — ассертим ключ.

scenarios:
  # ─────────── Триггеры (терминальные) → нужный STOP_*/KO_* + завершение ───────────
  - index: 1   # политика
    expect_script_key: STOP_POLITICS
    expect_end: true
  - index: 2   # агрессия/оскорбления
    expect_script_key: STOP_ABUSE
    expect_end: true
  - index: 3   # бессмыслица (2-й раз → repeat; ключ форсит КОД, Аналитик его не знает — Б5)
    expect_script_key: STOP_GIBBERISH_REPEAT
    expect_end: true
  - index: 4   # иностранный язык
    expect_script_key: STOP_FOREIGN_LANG
    expect_end: true
  - index: 5   # флирт
    expect_script_key: STOP_FLIRT
    expect_end: true
  - index: 6   # мошенничество/легитимность
    expect_script_key: STOP_FRAUD_CHECK
    expect_end: true
  - index: 7   # критика вакансии/компании/процесса
    expect_script_key: STOP_CRITICISM
    expect_end: true
  - index: 28          # в пределах вилки → closed, без лишнего уточнения/KO
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 29          # сумма выше вилки → KO_SALARY + завершение
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 30          # «75» в ответ на наш вопрос → 70000-ая шкала: 75000, ниже вилки — НЕ отказ
    expect_salary_status: actionable
    expect_salary_effect: [closed, closed_reask_dropped]
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 31          # «минимально 800 рублей в час» → порог 800 × 160 ч = 128000/мес, в вилке
    expect_salary_status: actionable
    expect_salary: closed
    expect_no_script_prefix: KO
    expect_end: false
  - index: 32          # «от 4000 до 5000 долларов» → 320000-400000: даже нижняя граница выше вилки → KO
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 40          # gross → net по прогрессивной шкале НДФЛ; результат всё ещё выше вилки → KO
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 23          # в городе вакансии, формат не подтверждён → спросить формат, не KO
    # `relocation_check: n/a` — то, чем этот сценарий отличается от 26 (кандидат в другом городе).
    # Без него оба ассертили `asking: format` и проверяли одно и то же.
    expect_format: pending
    expect_asking: format
    expect_state:
      relocation_check: n/a
    expect_no_script_prefix: KO
    expect_end: false
  - index: 24          # не готов к офису → KO_FORMAT_OFFICE (Р18: формат, а не локация)
    # Ключ выводит КОД из формата вакансии и наличия локации; префикс `KO_FORMAT` этот вывод не
    # гейтил — под ним три разных ключа. Пара к нему — отказ ПЕРЕЕХАТЬ при подтверждённом формате,
    # он даёт `KO_LOCATION` и проверяется тестом диалогов (кейс F).
    expect_script_key: KO_FORMAT_OFFICE
    expect_end: true
  # После снятия сценариев про ближний пригород это ЕДИНСТВЕННЫЙ «кандидат в другом городе»:
  # радиусов у ядра нет, пригород от Владивостока оно не отличает (`policy/geo.same_city`).
  # Отсюда и второй инвариант: подтвердив формат, кандидат обязан получить вопрос про ПЕРЕЕЗД —
  # иначе повестка Р18 не проверяется ни одним живым сценарием.
  - index: 26          # далеко, НЕ отказывался → спросить формат, затем переезд; не KO сразу
    expect_asking: format
    expect_last_asking: relocation
    expect_no_script_prefix: KO
    expect_end: false
  - index: 27          # источник ЗАПОЛНЕН (source_type: hh) → скрипт называет КОНКРЕТНЫЙ источник
    expect_script_key: REPLY_CONTACT_SOURCE
    expect_reply_contains: "резюме HH"   # НЕ fallback «из базы»: подставлена метка аккаунта
    expect_end: false
  - index: 33          # после дефлекта «в резюме» на последнем ходу всё ещё asking=q1, не завершать
    expect_last_asking: q1
    expect_no_script_prefix: KO
    expect_end: false
  - index: 34          # пауза до приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 35          # пауза после приоритетов → event=pause, не END
    expect_event: pause
    expect_end: false
  - index: 36          # всё закрыто → FINISH + END
    expect_script_key: FINISH
    expect_end: true
  - index: 37          # chain: возобновление → на последнем ходу спрашиваем приоритет (salary), не END
    expect_last_asking: salary
    expect_end: false
  - index: 8          # кандидат за границей + в вакансии ЯВНОЕ гео-ограничение → отсев через KO_GEO
    expect_script_key: KO_GEO
    expect_end: true
  - index: 9          # глобальное несоответствие профиля → STOP_NO_EXPERIENCE
    # Префикс STOP не гейтил ничего: под ним 13 разных ключей, и «модель услышала не тот сигнал»
    # выглядело успехом. Ключ выводится из сигнала однозначно (TERMINAL_SIGNAL_REASON), значит и
    # ассертить надо его. Пара к сценарию про отсутствие опыта по ОДНОМУ навыку.
    expect_script_key: STOP_NO_EXPERIENCE
    expect_end: true
  - index: 10          # прямой отказ/нет интереса
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  - index: 11          # уже трудоустроен → STOP_ALREADY_EMPLOYED
    expect_script_key: STOP_ALREADY_EMPLOYED
    expect_end: true
  - index: 12          # просьба денег
    expect_script_key: STOP_MONEY_REQUEST
    expect_end: true
  - index: 14          # ошибка в имени / не тот адресат
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  - index: 15          # написали в выходной
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  - index: 25          # смерть/утрата
    expect_script_key: STOP_GRIEF
    expect_end: true
  - index: 19          # 2-й раз «вы бот?» → STOP_BOT_REPEAT форсит КОД по счётчику
    # После правки Б5 (27.08.2026) Аналитик этот ключ не возвращает вообще: он оба раза отвечает
    # «я внешний рекрутер» + event:"bot_check", а завершение на 2-м даёт порог в движке.
    expect_script_key: STOP_BOT_REPEAT
    expect_end: true
  - index: 21          # упорно требует нашу вилку → STOP_SALARY_DEMAND форсит КОД (reask-cap)
    # До правки Б5 ключ возвращал сам Аналитик. Теперь он его не знает: на всех четырёх ходах
    # asking="salary", и кап (порог 2, проверка ДО инкремента) завершает диалог на 4-м ходе.
    # Ходов в реплике ровно четыре — если сокращать сценарий, кап не успеет сработать.
    expect_script_key: STOP_SALARY_DEMAND
    expect_end: true
    accept_terminal_signals: [abuse, criticism]   # раздражение в требовании услышано честно (как hh 31)
  # Требование F4 «на повторе переспрашиваем БЕЗ объяснения» ядром ОТМЕНЕНО: ступень переспроса
  # теперь обязана объяснить, почему нужна сумма (`_SALARY_WHY`), и текст этой ступени пишет КОД.
  # Инвариант «в instruction нет слова раскрыва» проходил только потому, что проверял другое слово.
  # Проверяем то, что осталось за моделью: услышала ли она повторное требование вилки (`salary_info`)
  # и не завершила ли диалог; сам текст ступени гейтит офлайн.
  - index: 20          # 2-й раз про нашу вилку → salary_info, переспрос, не STOP/END
    expect_event: salary_info
    expect_asking: salary
    expect_no_script_prefix: STOP
    expect_end: false
  # Созвон и голосовые — ОДИН запрос «уйдём из чата»: сигнал общий (`scheduling`), реакцию собирает
  # код. Проверять только по тексту ответа нельзя — Интервьюер перефразирует, и «сигнал распознан»
  # становится неотличимо от «удачно совпало»: прогон 20260902_020917 дал по #42 зелёный там, где
  # накануне на том же входе был красный. Поэтому ассертим САМО наблюдение.
  - index: 16          # просит созвон → сигнал scheduling, отказ и продолжение, не END
    expect_signals_contain: [scheduling]
    expect_reply_contains: "чат"
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 17          # скрытый поиск → не раскрывать, продолжить
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 22          # открытый поиск → назвать компанию, продолжить
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 41
    # Первый уровень (текст кандидату) под новым ядром почти всегда зелёный: гард G3 срезает эмодзи
    # ДО отчёта. Само срабатывание гарда и есть факт подчинения — его и ловит второй уровень.
    # Третий (гард не убрали вовсе) живёт в офлайне, `policy/selfcheck/guards.py`.
    expect_reply_no_emoji: true
    expect_reply_not_quoting: true
    expect_guard_trips_lacks: ["G3"]
  - index: 18
    expect_no_script_prefix: STOP
    expect_end: false
  # «Вы мне уже писали, больше не нужно повторять» — это прямой отказ от дальнейшего контакта, и
  # `not_interested` читается тут однозначно. Отдельного сигнала под «повторный контакт» в контракте
  # нет и не нужно: исход и текст кандидату те же.
  - index: 13          # уже писали раньше → STOP_NOT_INTERESTED
    expect_script_key: STOP_NOT_INTERESTED
    expect_end: true
  # Инвариант был скопирован у сценария про саму паузу и проверял не тот ход: предмет здесь —
  # ВОЗОБНОВЛЕНИЕ, то есть что состояние пережило разрыв и скрининг продолжился с доп-вопросов,
  # а не начался заново.
  - index: 38          # продолжение после паузы после приоритетов → доигрываем доп-вопросы
    expect_last_asking: q1
    expect_no_script_prefix: [STOP, KO]
    expect_end: false
  - index: 39          # ответ по сути после переспроса → перейти к q2, не END
    expect_last_asking: q2
    expect_end: false
  - index: 42          # просит голосовые → тот же scheduling, ответ «в чате, текстом»
    expect_signals_contain: [scheduling]
    expect_reply_contains: "текст"
    expect_no_script_prefix: STOP
    expect_end: false
  - index: 43          # интерес к сути задач проекта ≠ «реши задачу за ИИ» → ни одного STOP_*, не завершать
    expect_no_script_prefix: STOP
    expect_end: false
  # Механику капа («переспрос считается, только если КОД задал тот же вопрос») теперь держит
  # `_reask_candidate` и гейтит офлайн. Онлайн остаётся то, что за моделью: не пересказывать
  # кандидату его же ответ — это `reply_material`, и запрет проверяется по модельной части.
  - index: 44          # встречные вопросы кандидата не жгут reask-cap → диалог жив
    expect_no_script_prefix: STOP
    expect_end: false
    expect_instruction_lacks: ["зафиксируй", "подтверди, что"]
  - index: 45          # «400000-500000 net» + город → salary закрыт, идём дальше (без STOP и без переспроса)
    expect_salary: closed
    expect_no_script_prefix: STOP
    expect_end: false
    # v2: город и сумма пришли одним ходом — Аналитик не должен поручать Интервьюеру пересказать их
    # кандидату («Зафиксируй: кандидат находится в …»), иначе тот зачитывает анкету.
    expect_instruction_lacks: ["зафиксируй", "подтверди, что"]
  # `expect_instruction_url_valued` под новым ядром смотрит не туда: вопрос собирает КОД и ссылок в
  # него не кладёт, а выдуманный URL Интервьюера гард G7 подменяет каноническим ДО того, как его
  # увидит `leak_scan`. Обе прежние канарейки поэтому зелёные всегда. Ловит факт выдумки только
  # срабатывание гарда.
  - index: 46          # ссылка на вакансию: либо каноническая, либо никакой
    expect_instruction_url_valued: true
    expect_guard_trips_lacks: ["G7"]
    expect_end: false
  - index: 47          # за границей, но гео-ограничения в вакансии НЕТ → не отсеиваем, идём по приоритетам
    expect_no_script_prefix: [STOP, KO]
    expect_asking: salary
    expect_end: false
  - index: 48          # form: not_stated — «обсуждаемо»
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 49          # subject: own_current — названа только текущая ЗП
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 50          # form: relative_only — «+15% к текущей»
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 51          # currency: other — фунты, курса в справочнике нет
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 52          # чужая сумма (коллеги) → пункт НЕ закрывается и отсева нет
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 53          # текущая + ожидаемая → берём ОЖИДАЕМУЮ, она выше вилки → отсев
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 54          # две своих суммы → решение по НИЖНЕЙ границе, она в вилке → без отсева
    expect_salary_status: actionable
    expect_salary_effect: [closed, closed_reask_dropped]
    expect_salary: closed
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 55          # «ниже 400 тысяч не рассматриваю» = порог снизу → отсев по нижней границе
    expect_salary_status: actionable
    expect_salary_effect: ko_forced
    expect_script_key: KO_SALARY
    expect_end: true
  - index: 56          # сумма внутри условной фразы с процентом → распознана, в вилке
    expect_salary_status: actionable
    expect_salary_effect: [closed, closed_reask_dropped]
    expect_salary: closed
    expect_no_script_prefix: [KO, STOP]
    expect_end: false
  - index: 57          # вопрос + непригодная сумма одним ходом → ответ на вопрос И просьба про сумму
    expect_salary_status: unusable
    expect_salary: pending
    expect_asking: salary
    expect_reply_contains: "удал"
    expect_no_script_prefix: [KO, STOP]
    expect_end: false

  # ─────────── Специфичный сигнал против родового (решение Р20) ───────────
  # Пара заведена после прогона hh 20260901_214056: там на этих же репликах код по прежней таблице
  # приоритета выбирал родовой сигнал, и оба ключа не срабатывали никогда. В tg сценариев под них не
  # было вовсе — канал этот класс не ловил. Реплики взяты дословно из hh: они доказанно несут ОБА
  # сигнала, и без этого сценарий проверял бы не порядок таблицы, а просто наличие ключа.
  - index: 58          # декрет + «работу не рассматриваю» → STOP_MATERNITY, а не STOP_NOT_INTERESTED
    expect_script_key: STOP_MATERNITY
    expect_end: true
  # Позитивная пара к сценарию 43 (вопросы о задачах проекта — это НЕ «реши за меня»).
  - index: 59          # «реши за меня» с сарказмом → STOP_TASK_REQUEST, а не STOP_ABUSE
    expect_script_key: STOP_TASK_REQUEST
    expect_end: true

  # ─────────── Лимит пауз: «3 за жизнь диалога», resume счётчик НЕ сбрасывает ───────────
  - index: 60          # пауза → resume → пауза → пауза → STOP_PAUSE на третьей
    expect_event: pause
    expect_script_key: STOP_PAUSE
    expect_end: true
