# Боевой тест анти-зацикливания. По мотивам реальных лупов из отчётов (screening_split_170200 и др.),
# где кандидат по 6 ходов настойчиво спрашивал/требовал одно и то же и диалог крутился до потолка.
#
# Гоняется РЕАЛЬНЫМ Аналитиком (LLM) через движок; Интервьюер и стор фейковые (текст Интервьюера на
# счётчик не влияет, токены тратит только Аналитик — по вызову на ход). Реплики лупов — чистые (без
# новых фактов), чтобы прогресс не обнулял счётчик и не маскировал зацикливание.
#
# expect (жёсткий — только анти-луп/здоровье; механизм — телеметрия в отчёте, НЕ гейт):
#   ended_by: <int>          — обязан завершиться не позже этого хода (1-based);
#   terminal: STOP | FINISH  — класс завершения (луп → любой STOP_*; здоровый диалог → FINISH);
#   script: <STOP_*>         — ТОЧНЫЙ скрипт: только для регрессии, где механизм детерминирован;
#   max_no_progress: <int>   — max серии непрогресса за диалог ≤ порога (инвариант, на котором стоит кап).
cases:
  # ─────────── ЛУПЫ: настойчивый переспрашиватель → должен завершиться STOP_* в пределах кап ───────────
  - name: "компания (скрытый поиск) — луп на вопросе о компании"
    vacancy: {company_name: "СКРЫТО"}
    turns:
      - "А можно узнать, в какой компании вакансия?"
      - "Всё же назовите название компании, мне это важно."
      - "Повторю: как называется компания?"
      - "Вы так и не сказали — какая всё-таки компания?"
      - "Дайте хотя бы название компании."
      - "Компанию назовите, пожалуйста."
    expect: {ended_by: 5, terminal: STOP}

  - name: "компания (открытый поиск) — луп на вопросе о компании"
    vacancy: {}
    turns:
      - "Как называется компания? Дайте ссылку на сайт."
      - "Повторяю, какая компания? Нужно понимать, с кем работаю."
      - "Я уже спрашивал — где ещё почитать про компанию?"
      - "Вы серьёзно? Дайте более прозрачную информацию о компании."
      - "Если не готовы рассказать про компанию — зачем разговор?"
      - "Так какая всё-таки компания?"
    expect: {ended_by: 5, terminal: STOP}

  - name: "звонок — луп на требовании созвона"
    turns:
      - "Когда созвон? Скажите время."
      - "Назначьте уже конкретное время звонка."
      - "Давайте по делу — назначайте звонок на завтра."
      - "Можно не усложнять? Звонок завтра в удобное время."
      - "Так когда созвон-то?"
      - "Жду от вас время звонка."
    expect: {ended_by: 5, terminal: STOP}

  - name: "«всё в резюме» — луп на отказе отвечать"
    turns:
      - "Всё уже в резюме, почитайте внимательно."
      - "Зарплата и город в резюме, перечитайте."
      - "Всё подробно описано в резюме, не хочу повторять."
      - "Ну вот, писал же — всё в резюме."
      - "В резюме всё есть, не вижу смысла повторять здесь."
      - "Смотрите резюме, там всё."
    expect: {ended_by: 6, terminal: STOP}

  # ─────────── РЕГРЕССИЯ: специфический счётчик срабатывает, кап не подменяет (скрипт детерминирован) ──
  - name: "источник контакта ×N → contact_source счётчик"
    source_type: "hh"
    turns:
      - "Откуда у вас мой контакт?"
      - "Нет, серьёзно, где вы взяли мои данные?"
      - "Я же спрашиваю — откуда мой контакт взялся?"
      - "Так откуда данные-то у вас?"
    expect: {ended_by: 4, terminal: STOP, script: STOP_PERSISTENT}

  # Завершает САМ Аналитик по своему счётчику salary_info (прогон 203327: source=None), а не код-кап,
  # поэтому порог salary_reasks=3 (инцидент 2026-08-17) на этот кейс не влияет.
  - name: "требует НАШУ вилку ×N → анти-луп по зарплате"
    turns:
      - "А какая у вас вилка по зарплате?"
      - "Нет, назовите вашу вилку, сколько платите."
      - "Просто скажите цифру, какой у вас бюджет."
      - "Я жду конкретную сумму от вас, назовите."
    expect: {ended_by: 4, terminal: STOP, script: STOP_SALARY_DEMAND}

  # ─── Off-topic после закрытых приоритетов. ПРИМ.: универсальный no_progress-cap вживую НЕдостижим —
  #     q-reask-cap (refused = прогресс) держит no_progress ≤ 2, а болтовню/абсурд Аналитик метит
  #     gibberish → gibberish-счётчик. Код капа проверяется отдельно (офлайн-набор с фейковым Аналитиком,
  #     где решения контролируем). Кейс ниже подтверждает: «отвечу с ИИ» уходит в gibberish → STOP на 2-м. ───
  - name: "приоритеты закрыты → настойчиво «отвечу с ИИ» (answer_aid → gibberish-счётчик)"
    turns:
      - "Ориентируюсь на 240000 на руки в месяц, живу в Москве."
      - "Я буду отвечать с помощью ИИ, так удобнее."
      - "Всё равно воспользуюсь ChatGPT для ответов."
      - "Нейросеть поможет отвечать точнее, продолжаю с ней."
      - "С ИИ мне спокойнее, так и буду."
      - "Да, отвечаю через нейросеть, спрашивайте."
    expect: {ended_by: 6, terminal: STOP}

  # ─────────── НЕГАТИВНЫЕ (Пробел 1): здоровый кандидат → FINISH, кап НЕ рубит; max серии ≤ 2 ───────────
  - name: "кооперативный: отвечает по сути → FINISH, кап не срабатывает"
    turns:
      - "Ориентируюсь на 240000 рублей на руки в месяц, живу в Москве."
      - "Опыт с Python больше пяти лет, работал с Django и Flask."
      - "Да, поддерживал высоконагруженные сервисы под нагрузкой."
      - "SQL использую для сложных запросов, оптимизации и отчётов."
    expect: {finish: true, max_no_progress: 2}

  - name: "кооперативный (развёрнуто): по сути, но многословно → FINISH, кап не срабатывает"
    turns:
      - "По деньгам ориентир 240 тысяч на руки, сейчас в Москве, готов к удалёнке."
      - "С питоном работаю лет шесть — в основном Django и Flask, плюс asyncio и REST API."
      - "Да, была нагрузка: сервисы на сотни тысяч запросов в сутки, занимался оптимизацией."
      - "SQL активно — сложные запросы, индексы, оптимизация планов, партиционирование."
    expect: {finish: true, max_no_progress: 2}
