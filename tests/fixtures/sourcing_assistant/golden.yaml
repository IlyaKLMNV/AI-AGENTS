# Golden-кейсы sourcing_assistant (задача: консервативная, но НЕ заниженная 0/1-оценка по требованиям).
#
# requirements — требования-предложения (нейтральный стиль); candidate_data — данные кандидата
# (резюме / профиль / анкета — НЕ только резюме); expect_passed — эталон 0/1 той же длины;
# offline_output — каннный корректный ответ для --offline (requirement = точный echo, comment согласован с passed).
# Правило: 1 при ЯВНОМ ИЛИ близком по смыслу подтверждении в данных кандидата; 0 — если нет/косвенное
# (роль ≠ технология)/из текста вакансии. НЕ занижать при близком подтверждении.

# --- навыки: явное наличие / отсутствие (нейтральный стиль) ---
- name: neutral_requirement_skill_positive
  requirements: ["Опыт работы с PostgreSQL."]
  candidate_data: "Навыки: Python, PostgreSQL, Docker."
  expect_passed: [1]
  offline_output:
    - {requirement: "Опыт работы с PostgreSQL.", comment: "PostgreSQL указан в навыках кандидата.", passed: 1}

- name: neutral_requirement_skill_negative
  requirements: ["Опыт работы с Kubernetes."]
  candidate_data: "Навыки: Python, PostgreSQL, Docker."
  expect_passed: [0]
  offline_output:
    - {requirement: "Опыт работы с Kubernetes.", comment: "В данных кандидата Kubernetes не найден.", passed: 0}

# --- готовность: близкие формулировки (рассматриваю / возможны), не только слово «готов» ---
- name: readiness_travel_positive_possible
  requirements: ["Готовность к редким командировкам в Ереван."]
  candidate_data: "Рассматриваю редкие командировки. Поездки в Ереван возможны."
  expect_passed: [1]
  offline_output:
    - {requirement: "Готовность к редким командировкам в Ереван.", comment: "Кандидат указал, что поездки в Ереван возможны.", passed: 1}

- name: readiness_office_positive_considers
  requirements: ["Готовность работать в офисе в Москве."]
  candidate_data: "Проживаю в Москве, офисный формат рассматриваю."
  expect_passed: [1]
  offline_output:
    - {requirement: "Готовность работать в офисе в Москве.", comment: "Кандидат в Москве и рассматривает офис.", passed: 1}

- name: readiness_travel_negative_absent
  requirements: ["Готовность к редким командировкам в Ереван."]
  candidate_data: "Проживаю в Москве. Рассматриваю удалённую работу."
  expect_passed: [0]
  offline_output:
    - {requirement: "Готовность к редким командировкам в Ереван.", comment: "Готовность к командировкам в данных не найдена.", passed: 0}

# --- наличие устройства и интернета (новый тип требований) ---
- name: device_and_internet_positive
  requirements:
    - "Наличие смартфона или планшета с Android 10 или iOS 15.0 и выше."
    - "Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с."
  candidate_data: "Есть смартфон на Android 13. Домашний интернет 100 Мбит/с."
  expect_passed: [1, 1]
  offline_output:
    - {requirement: "Наличие смартфона или планшета с Android 10 или iOS 15.0 и выше.", comment: "Указан смартфон на Android 13.", passed: 1}
    - {requirement: "Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с.", comment: "Указан интернет 100 Мбит/с.", passed: 1}

- name: device_and_internet_negative_absent
  requirements: ["Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с."]
  candidate_data: "Опыт работы: оператор поддержки, удалённо."
  expect_passed: [0]
  offline_output:
    - {requirement: "Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с.", comment: "Скорость интернета в данных не указана.", passed: 0}

# --- источник: профиль / анкета (не только резюме) ---
- name: profile_data_city_positive
  requirements: ["Готовность работать в офисе в Москве."]
  candidate_data: |
    Резюме: Backend-разработчик, Python, PostgreSQL.
    Профиль кандидата: Город: Москва. Формат: рассматривает офис и гибрид.
  expect_passed: [1]
  offline_output:
    - {requirement: "Готовность работать в офисе в Москве.", comment: "В профиле указан город Москва и офис.", passed: 1}

- name: profile_data_relocation_positive
  requirements: ["Готовность к релокации в Ереван."]
  candidate_data: "Анкета кандидата: Релокация: Ереван рассматриваю."
  expect_passed: [1]
  offline_output:
    - {requirement: "Готовность к релокации в Ереван.", comment: "В анкете указана готовность к релокации в Ереван.", passed: 1}

# --- текст вакансии НЕ доказательство по кандидату ---
- name: vacancy_text_not_evidence_for_candidate
  requirements: ["Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с."]
  candidate_data: |
    Вакансия: Для работы требуется стабильный интернет 20 Мбит/с.
    Резюме кандидата: Python-разработчик. Опыт backend-разработки 3 года.
  expect_passed: [0]
  offline_output:
    - {requirement: "Наличие стабильного интернет-соединения со скоростью не менее 20 Мбит/с.", comment: "Интернет упомянут в вакансии, а не в данных кандидата.", passed: 0}

- name: vacancy_city_not_candidate_city
  requirements: ["Готовность работать в офисе в Москве."]
  candidate_data: |
    Вакансия: Офис в Москве.
    Резюме кандидата: Backend-разработчик. Город проживания не указан.
  expect_passed: [0]
  offline_output:
    - {requirement: "Готовность работать в офисе в Москве.", comment: "Город кандидата не указан, Москва только в вакансии.", passed: 0}

